#mai-toggle{
    position:fixed;
    right:25px;
    bottom:25px;
    width:64px;
    height:64px;
    border:none;
    border-radius:50%;
    background:#ffffff;
    padding:5px;
    cursor:pointer;
    box-shadow:
        0 0 0 3px rgba(255,255,255,.9),
        0 0 0 6px rgba(190,215,59,.35),
        0 10px 28px rgba(41,35,95,.45);
    transition:transform .25s ease, box-shadow .25s ease;
    z-index:2147483647;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:mai-glow 2.6s ease-in-out infinite;
}
#mai-toggle:hover{
    transform:scale(1.08);
    box-shadow:
        0 0 0 3px rgba(255,255,255,.95),
        0 0 0 8px rgba(190,215,59,.5),
        0 14px 34px rgba(41,35,95,.55);
}
#mai-toggle:active{ transform:scale(.96); }

#mai-toggle img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    display:block;
}

@keyframes mai-glow{
    0%, 100%{
        box-shadow:
            0 0 0 3px rgba(255,255,255,.9),
            0 0 0 6px rgba(190,215,59,.35),
            0 10px 28px rgba(41,35,95,.45);
    }
    50%{
        box-shadow:
            0 0 0 3px rgba(255,255,255,.9),
            0 0 0 9px rgba(190,215,59,.55),
            0 12px 32px rgba(41,35,95,.5);
    }
}
#mai-badge{
    position:absolute;
    top:0px;
    right:0px;
    background:#ef4444;
    color:#fff;
    font-size:11px;
    font-weight:700;
    min-width:20px;
    height:20px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    border:2px solid #fff;
    padding:0 4px;
}

#mai-box{
    position:fixed;
    right:25px;
    bottom:98px;
    width:380px;
    height:620px;
    max-height:calc(100vh - 130px);
    display:none;
    flex-direction:column;
    background:var(--mai-bg);
    border-radius:var(--mai-radius);
    overflow:hidden;
    box-shadow:0 25px 60px rgba(20,10,50,.22);
    z-index:2147483647;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Cairo",sans-serif;
    opacity:0;
    transform:translateY(24px) scale(.96);
    transition:opacity .22s ease, transform .22s ease;
}
#mai-box.mai-open{
    display:flex;
    opacity:1;
    transform:none;
}

/* ---------------- header (Messenger style: light, avatar, active status) ---------------- */
#mai-header{
    padding:12px 16px;
    background:#ffffff;
    color:var(--mai-text);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
    border-bottom:1px solid #e4e6eb;
}
.mai-logo{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff;
    border:1px solid #e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
}
.mai-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:3px;
}
.mai-header-title{
    display:flex;
    flex-direction:column;
    flex:1;
    min-width:0;
    overflow:hidden;
}
.mai-header-title span:first-child{
    font-size:15.5px;
    font-weight:700;
    color:var(--mai-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.mai-status{
    font-size:12.5px;
    color:#65676b;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.mai-status::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:#31a24c;
    flex-shrink:0;
}
#mai-close{
    background:#f0f2f5;
    border:none;
    color:#65676b;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:15px;
    flex-shrink:0;
    transition:background .2s;
}
#mai-close:hover{ background:#e4e6eb; }

#mai-whatsapp{
    background:#f0f2f5;
    border:none;
    color:#25D366;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s, transform .2s;
}
#mai-whatsapp:hover{ background:#e4e6eb; transform:scale(1.06); }

.mai-status.mai-away::before{ background:#8a8d91; }

/* ---------------- messages area + logo watermark ---------------- */
#mai-messages{
    flex:1;
    padding:18px;
    overflow-y:auto;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    gap:3px;
    position:relative;
}
#mai-messages{
    flex:1;
    padding:18px;
    overflow-y:auto;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    gap:3px;
    position:relative;
}

/* Logo watermark */
#mai-messages::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:var(--mai-logo-url);
    background-repeat:no-repeat;
    background-position:center;
    background-size:70%;
    opacity:0.10;
    pointer-events:none;
    z-index:0;
}
#mai-messages::-webkit-scrollbar{ width:6px; }
#mai-messages::-webkit-scrollbar-thumb{
    background:#d5d5e0;
    border-radius:10px;
}

/* row wrapper: lets us show a small avatar next to bot bubbles, Messenger style */
.mai-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
    max-width:100%;
    position:relative;
    z-index:1;
    margin:3px 0;
}
.mai-row-user{ justify-content:flex-end; }
.mai-row-bot{ justify-content:flex-start; }
.mai-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    object-fit:contain;
    background:#fff;
    border:1px solid #e4e6eb;
    flex-shrink:0;
    padding:2px;
}
.mai-avatar-spacer{ width:26px; flex-shrink:0; }

.mai-msg{
    padding:9px 14px;
    border-radius:var(--mai-radius);
    max-width:78%;
    line-height:1.45;
    font-size:14.5px;
    word-wrap:break-word;
    white-space:pre-wrap;
    animation:mai-fade .18s ease;
}
@keyframes mai-fade{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
}

.mai-user{
    background:linear-gradient(135deg,var(--mai-primary),var(--mai-primary-light));
    color:#fff;
    border-bottom-right-radius:4px;
}
.mai-bot{
    background:var(--mai-bot-bubble);
    color:var(--mai-text);
    border-bottom-left-radius:4px;
}
.mai-time{
    font-size:10px;
    opacity:.55;
    margin-top:3px;
    text-align:right;
}
.mai-bot .mai-time{ text-align:left; }

/* ---------------- image bubble (professional) ---------------- */
.mai-msg .mai-image-wrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    line-height:0;
    box-shadow:0 4px 14px rgba(20,10,50,.15);
}
.mai-msg .mai-image-wrap img.mai-img{
    display:block;
    width:100%;
    max-width:220px;
    max-height:250px;
    object-fit:cover;
    transition:transform .35s ease;
}
.mai-image-wrap:hover img.mai-img{
    transform:scale(1.04);
}
.mai-image-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
    opacity:0;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    padding:8px;
    transition:opacity .2s ease;
}
.mai-image-wrap:hover .mai-image-overlay{ opacity:1; }
.mai-image-overlay span{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    color:var(--mai-primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

/* ---------------- lightbox ---------------- */
#mai-lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,8,20,.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2147483647;
    padding:30px;
}
#mai-lightbox.mai-lightbox-open{ display:flex; }
#mai-lightbox img{
    max-width:90vw;
    max-height:85vh;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.mai-lightbox-btn{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s;
}
.mai-lightbox-btn:hover{ background:rgba(255,255,255,.25); }
#mai-lightbox-close{ top:20px; right:20px; }
#mai-lightbox-download{ top:20px; right:74px; }

/* typing indicator */
.mai-typing{
    background:var(--mai-bot-bubble);
    border-bottom-left-radius:4px;
    padding:11px 15px;
    border-radius:var(--mai-radius);
    display:flex;
    gap:4px;
}
.mai-typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#8d8f93;
    animation:mai-bounce 1.1s infinite;
}
.mai-typing span:nth-child(2){ animation-delay:.15s; }
.mai-typing span:nth-child(3){ animation-delay:.3s; }
@keyframes mai-bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-5px); opacity:1; }
}

/* ---------------- input row (Messenger style pill) ---------------- */
#mai-input-row{
    display:flex;
    align-items:flex-end;
    padding:10px 12px;
    background:#fff;
    gap:6px;
    border-top:1px solid #e4e6eb;
    flex-shrink:0;
}
#mai-message{
    flex:1;
    min-width:0;
    padding:10px 16px;
    border-radius:20px;
    border:none;
    background:#f0f2f5;
    font-size:14.5px;
    outline:none;
    font-family:inherit;
    color:var(--mai-text);
    transition:background .2s, border-radius .1s;
    resize:none;
    overflow-y:hidden;
    max-height:120px;
    line-height:1.4;
    display:block;
}
#mai-message:focus{ background:#e9ebef; }
#mai-message:disabled{ background:#f5f5f5; cursor:not-allowed; }

.mai-icon-btn{
    width:38px;
    height:38px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:none;
    color:var(--mai-primary);
    font-size:19px;
    cursor:pointer;
    transition:transform .2s, background .2s, opacity .2s;
    display:flex;
    align-items:center;
    justify-content:center;
}
.mai-icon-btn:hover:not(:disabled){ background:#f0f2f5; transform:scale(1.06); }
.mai-icon-btn:disabled{ opacity:.5; cursor:not-allowed; }

#mai-send{
    width:38px;
    height:38px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:none;
    color:var(--mai-primary);
    font-size:22px;
    cursor:pointer;
    transition:transform .2s, opacity .2s;
    display:flex;
    align-items:center;
    justify-content:center;
}
#mai-send:hover:not(:disabled){ transform:scale(1.1); }
#mai-send:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

/* ---------------- proactive teaser bubble (near the launcher) ---------------- */
#mai-teaser{
    position:fixed;
    right:96px;
    bottom:38px;
    max-width:220px;
    background:#fff;
    color:var(--mai-text);
    padding:12px 16px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(20,10,50,.18);
    font-size:13.5px;
    line-height:1.4;
    display:none;
    align-items:center;
    gap:8px;
    cursor:pointer;
    z-index:2147483646;
    animation:mai-fade .25s ease;
}
#mai-teaser.mai-show{ display:flex; }
#mai-teaser-close{
    background:none;
    border:none;
    color:#8a8d91;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
    padding:2px;
}

/* ---------------- quick reply chips ---------------- */
.mai-quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:4px 0 10px 32px;
    position:relative;
    z-index:1;
}
.mai-chip{
    border:1.5px solid var(--mai-primary);
    color:var(--mai-primary);
    background:#fff;
    border-radius:16px;
    padding:7px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, color .15s;
    white-space:nowrap;
}
.mai-chip:hover{ background:var(--mai-primary); color:#fff; }

@media (max-width:640px){
    #mai-box{
        right:0;
        left:0;
        top:0;
        bottom:0;
        width:100%;
        height:100vh;
        height:100dvh;
        max-height:none;
        border-radius:0;
    }
    #mai-header{
        padding-top:calc(12px + env(safe-area-inset-top));
        padding-left:calc(16px + env(safe-area-inset-left));
        padding-right:calc(16px + env(safe-area-inset-right));
    }
    #mai-close{
        width:38px;
        height:38px;
        font-size:16px;
    }
    #mai-messages{
        padding-left:calc(18px + env(safe-area-inset-left));
        padding-right:calc(18px + env(safe-area-inset-right));
    }
    #mai-input-row{
        padding-bottom:calc(10px + env(safe-area-inset-bottom));
        padding-left:calc(12px + env(safe-area-inset-left));
        padding-right:calc(12px + env(safe-area-inset-right));
    }
    /* 16px prevents iOS Safari from auto-zooming the page when the field is focused */
    #mai-message{
        font-size:16px;
    }
    #mai-send{
        width:42px;
        height:42px;
    }
    .mai-msg{
        max-width:85%;
    }
    #mai-toggle{
        right:16px;
        bottom:calc(16px + env(safe-area-inset-bottom));
    }
}
</style>

    function escapeHtml(str){
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    // ---------------- session id (so the n8n AI Agent can keep context across messages) ----------------
    function getSessionId(){
        try{
            var id = localStorage.getItem(SESSION_KEY);
            if(!id){
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
                    "mai-" + Date.now() + "-" + Math.random().toString(16).slice(2);
                localStorage.setItem(SESSION_KEY, id);
            }
            return id;
        }catch(e){
            return "mai-" + Date.now();
        }
    }
    var SESSION_ID = getSessionId();

    // ---------------- working hours ----------------
    function isWithinWorkingHours(){
        var now = new Date();
        var day = now.getDay();
        var hour = now.getHours();
        return WORKING_HOURS.days.indexOf(day) !== -1 && hour >= WORKING_HOURS.start && hour < WORKING_HOURS.end;
    }

    function updateStatusIndicator(){
        if(!statusEl) return;
        if(isWithinWorkingHours()){
            statusEl.textContent = "Active now";
            statusEl.classList.remove("mai-away");
        } else {
            statusEl.textContent = "Away \u2014 we'll reply soon";
            statusEl.classList.add("mai-away");
        }
    }

    // ---------------- chat history persistence (localStorage) ----------------
    function saveHistoryEntry(entry){
        try{
            var raw = localStorage.getItem(HISTORY_KEY);
            var list = raw ? JSON.parse(raw) : [];
            list.push(entry);
            if(list.length > MAX_HISTORY_MESSAGES){
                list = list.slice(list.length - MAX_HISTORY_MESSAGES);
            }
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        }catch(e){
            // storage full or unavailable - fail silently, chat still works for this session
        }
    }

    function loadHistory(){
        try{
            var raw = localStorage.getItem(HISTORY_KEY);
            if(!raw) return [];
            return JSON.parse(raw) || [];
        }catch(e){
            return [];
        }
    }

    // ---------------- simple notification beep (no external audio file needed) ----------------
    function playNotifySound(){
        try{
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            var ctx = new AudioCtx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.33);
            osc.onended = function(){ if(ctx.close) ctx.close(); };
        }catch(e){}
    }

    // ---------------- unread badge ----------------
    function bumpUnread(){
        unreadCount++;
        badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
        badge.style.display = "flex";
    }
    function clearUnread(){
        unreadCount = 0;
        badge.style.display = "none";
    }

    // ---------------- proactive teaser bubble ----------------
    function showTeaser(){
        if(hasOpenedBefore) return;
        teaser.classList.add("mai-show");
    }
    function hideTeaser(){
        teaser.classList.remove("mai-show");
        if(teaserTimeoutId){ clearTimeout(teaserTimeoutId); teaserTimeoutId = null; }
    }
    teaserTimeoutId = setTimeout(showTeaser, 8000);
    teaser.addEventListener("click", function(){
        hideTeaser();
        openChat();
    });
    teaserClose.addEventListener("click", function(e){
        e.stopPropagation();
        hideTeaser();
    });

    // ---------------- WhatsApp handoff ----------------
    whatsappBtn.addEventListener("click", function(){
        window.open("https://wa.me/" + WHATSAPP_NUMBER, "_blank");
    });

    // ---------------- quick reply chips ----------------
    function renderQuickReplies(){
        var wrap = document.createElement("div");
        wrap.className = "mai-quick-replies";
        QUICK_REPLIES.forEach(function(label){
            var chip = document.createElement("button");
            chip.type = "button";
            chip.className = "mai-chip";
            chip.textContent = label;
            chip.addEventListener("click", function(){
                wrap.remove();
                input.value = label;
                sendTextMessage();
            });
            wrap.appendChild(chip);
        });
        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
    }

    // ---------------- send button: thumbs-up when empty, like Messenger ----------------
    function refreshSendButton(){
        if(input.value.trim().length > 0){
            sendBtn.innerHTML = ICON_SEND;
        } else {
            sendBtn.innerHTML = ICON_THUMB;
        }
    }
    input.addEventListener("input", refreshSendButton);

    // ---------------- lightbox ----------------
    function openLightbox(src){
        lightboxImg.src = src;
        lightbox.classList.add("mai-lightbox-open");
    }
    function closeLightbox(){
        lightbox.classList.remove("mai-lightbox-open");
        lightboxImg.src = "";
    }
    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function(e){
        if(e.target === lightbox) closeLightbox();
    });
    lightboxDownload.addEventListener("click", function(){
        if(!lightboxImg.src) return;
        var a = document.createElement("a");
        a.href = lightboxImg.src;
        a.download = "image.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
    });

    // kind: "text" | "image"
    function addMessage(kind, content, type, skipSave){
        var row = document.createElement("div");
        row.className = "mai-row " + (type === "user" ? "mai-row-user" : "mai-row-bot");

        if(type !== "user"){
            var avatar = document.createElement("img");
            avatar.className = "mai-avatar";
            avatar.src = LOGO_URL;
            avatar.alt = "";
            row.appendChild(avatar);
        }

        var div = document.createElement("div");
        div.className = "mai-msg " + (type === "user" ? "mai-user" : "mai-bot");
        div.dir = "auto";

        if(kind === "image"){
            var imgWrap = document.createElement("div");
            imgWrap.className = "mai-image-wrap";

            var img = document.createElement("img");
            img.className = "mai-img";
            img.src = content;
            img.alt = "Sent image";

            var overlay = document.createElement("div");
            overlay.className = "mai-image-overlay";
            overlay.innerHTML = "<span>&#128269;</span>";

            imgWrap.appendChild(img);
            imgWrap.appendChild(overlay);
            imgWrap.addEventListener("click", function(){ openLightbox(content); });

            div.appendChild(imgWrap);
        } else {
            var textDiv = document.createElement("div");
            textDiv.innerHTML = escapeHtml(content).replace(/\n/g, "<br>");
            div.appendChild(textDiv);
        }

        var timeLabel = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        var timeDiv = document.createElement("div");
        timeDiv.className = "mai-time";
        timeDiv.textContent = timeLabel;
        div.appendChild(timeDiv);

        row.appendChild(div);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;

        if(!skipSave){
            // Images aren't persisted in full (storage size) - keep a lightweight placeholder instead
            var histContent = kind === "image" ? "\uD83D\uDDBC\uFE0F Image" : content;
            saveHistoryEntry({ kind: "text", content: histContent, type: type, time: timeLabel });
        }
    }

    function showTyping(){
        var row = document.createElement("div");
        row.className = "mai-row mai-row-bot";
        row.id = "mai-typing-indicator";

        var avatar = document.createElement("img");
        avatar.className = "mai-avatar";
        avatar.src = LOGO_URL;
        avatar.alt = "";
        row.appendChild(avatar);

        var el = document.createElement("div");
        el.className = "mai-typing";
        el.innerHTML = "<span></span><span></span><span></span>";
        row.appendChild(el);

        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping(){
        var el = document.getElementById("mai-typing-indicator");
        if(el) el.remove();
    }

    function isMobile(){
        return window.matchMedia("(max-width:640px)").matches;
    }

    function openChat(){
        box.classList.add("mai-open");
        clearUnread();
        hideTeaser();
        if(isMobile()){
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
        } else {
            input.focus();
        }
        if(!hasOpenedBefore){
            hasOpenedBefore = true;

            var savedHistory = loadHistory();

            if(savedHistory.length > 0){
                // اليوزر ده زار الشات قبل كده - اعرض المحادثة السابقة
                savedHistory.forEach(function(entry){
                    addMessage(entry.kind || "text", entry.content, entry.type, true);
                });
            }

            // إظهار الرسالة الترحيبية ورسائل المساعدة دائماً عند فتح الشات لأول مرة في الجلسة
            // نستخدم skipSave = true حتى لا تتكرر الرسالة الترحيبية في الـ localStorage عند كل ريفريش
            addMessage(
                "text",
                "👋 Welcome to Milestones!\nHow can I help you today?",
                "bot",
                true
            );

            if(!isWithinWorkingHours()){
                addMessage("text", "🕒 We're currently outside our working hours. Leave us a message and we'll get back to you as soon as we're back online!", "bot", true);
            }

            renderQuickReplies();
        }
    }

    function closeChat(){
        box.classList.remove("mai-open");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";
    }

    toggle.addEventListener("click", function(){
        if(box.classList.contains("mai-open")){
            closeChat();
        } else {
            openChat();
        }
    });

    closeBtn.addEventListener("click", closeChat);

    function setSending(state){
        isSending = state;
        sendBtn.disabled = state;
        input.disabled = state;
    }

    // ---- core: send any payload (text / image) to the webhook ----
    function sendToWebhook(payload){
        setSending(true);
        showTyping();

        payload.sessionId = SESSION_ID;

        fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
})
.then(function(replyText){
    hideTyping();
    addMessage("text", replyText || ".", "bot");
            if(!box.classList.contains("mai-open")){
                bumpUnread();
                playNotifySound();
            }
        })
        .catch(function(err){
            console.error("Milestones AI chat error:", err);
            hideTyping();
            addMessage("text", "\u26A0\uFE0F Couldn't reach the server. Please try again in a moment.", "bot");
        })
        .finally(function(){
            setSending(false);
            input.focus();
        });
    }

    // ---- auto-growing message box: expands as the user types more, up to a max height ----
    function autoResizeInput(){
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
        input.style.overflowY = input.scrollHeight > 120 ? "auto" : "hidden";
    }
    input.addEventListener("input", autoResizeInput);

    // ---- text (or thumbs-up quick send, Messenger style) ----
    function sendTextMessage(){
        if(isSending) return;
        var text = input.value.trim();

        if(!text){
            // thumbs-up quick send, like Messenger's default send button
            addMessage("text", "\u{1F44D}", "user");
            sendToWebhook({ type: "text", message: "\u{1F44D}" });
            return;
        }

        addMessage("text", text, "user");
        input.value = "";
        refreshSendButton();
        autoResizeInput();

        sendToWebhook({ type: "text", message: text });
    }

    sendBtn.addEventListener("click", sendTextMessage);
    input.addEventListener("keydown", function(e){
        // Enter sends the message; Shift+Enter inserts a new line, so longer messages stay easy to write
        if(e.key === "Enter" && !e.shiftKey){
            e.preventDefault();
            sendTextMessage();
        }
    });

    refreshSendButton();
    autoResizeInput();
})();
</script>
