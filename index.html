  HOW TO USE

  - Visual polish: refined shadows/spacing/motion, tidier header with a

                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                </button>
                <div id="mai-menu" role="menu">
                    <button class="mai-menu-item mai-danger" id="mai-clear-chat" role="menuitem">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
                        Clear conversation
                    </button>
                </div>
            </div>

            <button class="mai-header-btn" id="mai-close" aria-label="Close chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <div id="mai-offline-banner" role="status">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
            You're offline — messages will send once you're back online.
        </div>

        <div id="mai-messages-wrap">
            <div id="mai-watermark" aria-hidden="true"></div>
            <div id="mai-messages" aria-live="polite"></div>
            <button id="mai-scroll-btn" aria-label="Scroll to latest messages">
                <span class="mai-dot"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
            </button>
        </div>

        <div id="mai-staged-image">
            <img id="mai-staged-thumb" src="" alt="">
            <span class="mai-staged-label">Image ready to send</span>
            <button id="mai-staged-remove" aria-label="Remove image">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <div id="mai-input-row">
            <button class="mai-icon-btn" id="mai-upload-btn" aria-label="Attach an image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="mai-file-input" accept="image/*" hidden>
            <textarea id="mai-message" autocomplete="off" placeholder="Write a message…" rows="1"></textarea>
            <button id="mai-send" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <div id="mai-lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
        <button class="mai-lightbox-btn" id="mai-lightbox-close" aria-label="Close preview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="mai-lightbox-btn" id="mai-lightbox-download" aria-label="Download image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M6 11l6 6 6-6M5 21h14"/></svg>
        </button>
        <img id="mai-lightbox-img" src="" alt="Full size image">
    </div>

</div>

<script>
(function(){
    "use strict";

    /* ======================================================================
       CONFIGURATION — edit these for your deployment
       ====================================================================== */
    var WEBHOOK          = "https://students.milestones-tech.com/webhook/Milestones_ChatBot";
    var WHATSAPP_NUMBER  = "201288818012"; // international format, digits only
    var WORKING_HOURS    = { days: [0, 1, 2, 3, 4], start: 9, end: 17 }; // 0=Sun … 6=Sat, local time
    var QUICK_REPLIES    = ["🌐 Our Services", "📍 Branch Locations", "📞 Contact Sales"];
    var MAX_IMAGE_MB     = 5;
    var MAX_HISTORY      = 60;

    // Paste your logo's "data:image/png;base64,...." string below.
    // It now only needs to live in this ONE place — it's reused for the
    // launcher icon, the header avatar, and the chat-background watermark.
    var LOGO_URL = "milestones_group_logo.png";

    var SESSION_KEY = "mai_session_id";
    var HISTORY_KEY = "mai_chat_history";

    /* ======================================================================
       DOM REFERENCES
       ====================================================================== */
    var root          = document.getElementById("mai-root");
    var toggleBtn      = document.getElementById("mai-toggle");
    var badge          = document.getElementById("mai-badge");
    var box            = document.getElementById("mai-box");
    var closeBtn       = document.getElementById("mai-close");
    var messagesWrap   = document.getElementById("mai-messages-wrap");
    var messages       = document.getElementById("mai-messages");
    var watermark      = document.getElementById("mai-watermark");
    var scrollBtn      = document.getElementById("mai-scroll-btn");
    var input          = document.getElementById("mai-message");
    var sendBtn        = document.getElementById("mai-send");
    var statusEl       = document.getElementById("mai-status");
    var offlineBanner  = document.getElementById("mai-offline-banner");

    var menuBtn        = document.getElementById("mai-menu-btn");
    var menu           = document.getElementById("mai-menu");
    var clearChatBtn   = document.getElementById("mai-clear-chat");
    var whatsappBtn    = document.getElementById("mai-whatsapp");

    var uploadBtn      = document.getElementById("mai-upload-btn");
    var fileInput      = document.getElementById("mai-file-input");
    var stagedWrap     = document.getElementById("mai-staged-image");
    var stagedThumb    = document.getElementById("mai-staged-thumb");
    var stagedRemove   = document.getElementById("mai-staged-remove");

    var teaser         = document.getElementById("mai-teaser");
    var teaserClose     = document.getElementById("mai-teaser-close");

    var lightbox         = document.getElementById("mai-lightbox");
    var lightboxImg       = document.getElementById("mai-lightbox-img");
    var lightboxClose     = document.getElementById("mai-lightbox-close");
    var lightboxDownload  = document.getElementById("mai-lightbox-download");

    /* ======================================================================
       STATE
       ====================================================================== */
    var state = {
        hasOpenedBefore: false,
        isSending: false,
        unreadCount: 0,
        lastFocusedEl: null,
        stagedImageDataUrl: null,
        lastRenderedDay: null,
        teaserTimer: null
    };

    /* ======================================================================
       UTILITIES
       ====================================================================== */
    function escapeHtml(str){
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function linkifyPhones(escapedHtml){
        // Keeps phone numbers left-to-right even inside RTL Arabic text.
        return escapedHtml.replace(/(\+?\d[\d\s\-]{6,}\d)/g,
            '<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">$1</span>');
    }

    function timeLabel(date){
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function dayLabel(date){
        var today = new Date();
        var yest = new Date(); yest.setDate(today.getDate() - 1);
        var sameDay = function(a, b){ return a.toDateString() === b.toDateString(); };
        if(sameDay(date, today)) return "Today";
        if(sameDay(date, yest)) return "Yesterday";
        return date.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function isMobile(){
        return window.matchMedia("(max-width: 640px)").matches;
    }

    /* ======================================================================
       SESSION + HISTORY PERSISTENCE
       ====================================================================== */
    function newSessionId(){
        return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
            "mai-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function getSessionId(){
        try{
            var id = localStorage.getItem(SESSION_KEY);
            if(!id){ id = newSessionId(); localStorage.setItem(SESSION_KEY, id); }
            return id;
        }catch(e){ return newSessionId(); }
    }
    var SESSION_ID = getSessionId();

    function loadHistory(){
        try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
        catch(e){ return []; }
    }

    function saveHistoryEntry(entry){
        try{
            var list = loadHistory();
            list.push(entry);
            if(list.length > MAX_HISTORY) list = list.slice(list.length - MAX_HISTORY);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        }catch(e){ /* storage unavailable — chat still works for this session */ }
    }

    function clearHistory(){
        try{ localStorage.removeItem(HISTORY_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
        SESSION_ID = getSessionId();
    }

    /* ======================================================================
       WORKING HOURS / STATUS
       ====================================================================== */
    function isWithinWorkingHours(){
        var now = new Date();
        return WORKING_HOURS.days.indexOf(now.getDay()) !== -1 &&
               now.getHours() >= WORKING_HOURS.start && now.getHours() < WORKING_HOURS.end;
    }

    function refreshStatusIndicator(){
        if(isWithinWorkingHours()){
            statusEl.textContent = "Active now";
            statusEl.classList.remove("mai-away");
        } else {
            statusEl.textContent = "Away — we'll reply soon";
            statusEl.classList.add("mai-away");
        }
    }

    /* ======================================================================
       SOUND + UNREAD BADGE
       ====================================================================== */
    function playNotifySound(){
        try{
            var Ctx = window.AudioContext || window.webkitAudioContext;
            var ctx = new Ctx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.33);
            osc.onended = function(){ if(ctx.close) ctx.close(); };
        }catch(e){}
    }

    function bumpUnread(){
        state.unreadCount++;
        badge.textContent = state.unreadCount > 9 ? "9+" : String(state.unreadCount);
        badge.style.display = "flex";
        toggleBtn.classList.add("mai-has-unread");
    }
    function clearUnread(){
        state.unreadCount = 0;
        badge.style.display = "none";
        toggleBtn.classList.remove("mai-has-unread");
    }

    /* ======================================================================
       SCROLL HANDLING
       ====================================================================== */
    function isNearBottom(){
        return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
    }
    function scrollToBottom(smooth){
        messages.scrollTo({ top: messages.scrollHeight, behavior: smooth === false ? "auto" : "smooth" });
    }
    messages.addEventListener("scroll", function(){
        if(isNearBottom()){
            scrollBtn.classList.remove("mai-show", "mai-has-new");
        } else {
            scrollBtn.classList.add("mai-show");
        }
    });
    scrollBtn.addEventListener("click", function(){ scrollToBottom(true); });

    /* ======================================================================
       MESSAGE RENDERING
       ====================================================================== */
    function maybeInsertDayDivider(date){
        var label = dayLabel(date);
        if(label !== state.lastRenderedDay){
            var div = document.createElement("div");
            div.className = "mai-day-divider";
            div.textContent = label;
            messages.appendChild(div);
            state.lastRenderedDay = label;
        }
    }

    function lastMessageSender(){
        var rows = messages.querySelectorAll(".mai-row");
        if(!rows.length) return null;
        var last = rows[rows.length - 1];
        return last.classList.contains("mai-row-user") ? "user" : "bot";
    }

    // Renders one message. kind: "text" | "image". type: "user" | "bot".
    // Returns the row element so callers can update delivery status later.
    function addMessage(kind, content, type, opts){
        opts = opts || {};
        var now = opts.date || new Date();
        if(!opts.skipDayDivider) maybeInsertDayDivider(now);

        var grouped = lastMessageSender() === type;
        var row = document.createElement("div");
        row.className = "mai-row " + (type === "user" ? "mai-row-user" : "mai-row-bot") + (grouped ? " mai-grouped" : "");

        if(type !== "user"){
            var avatar = document.createElement("img");
            avatar.className = "mai-avatar";
            avatar.src = LOGO_URL;
            avatar.alt = "";
            row.appendChild(avatar);
        }

        var bubble = document.createElement("div");
        bubble.className = "mai-msg " + (type === "user" ? "mai-user" : "mai-bot");
        bubble.dir = "auto";

        if(kind === "image"){
            var wrap = document.createElement("div");
            wrap.className = "mai-image-wrap";
            var img = document.createElement("img");
            img.src = content;
            img.alt = opts.caption ? opts.caption : "Sent image";
            var zoom = document.createElement("span");
            zoom.className = "mai-zoom";
            zoom.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';
            wrap.appendChild(img);
            wrap.appendChild(zoom);
            wrap.addEventListener("click", function(){ openLightbox(content); });
            bubble.appendChild(wrap);
            if(opts.caption){
                var cap = document.createElement("div");
                cap.className = "mai-image-caption";
                cap.textContent = opts.caption;
                bubble.appendChild(cap);
            }
        } else {
            var textDiv = document.createElement("div");
            var html = linkifyPhones(escapeHtml(content)).replace(/\n/g, "<br>");
            textDiv.innerHTML = html;
            bubble.appendChild(textDiv);
        }

        var meta = document.createElement("div");
        meta.className = "mai-meta";
        meta.innerHTML = '<span class="mai-meta-time">' + timeLabel(now) + "</span>";
        bubble.appendChild(meta);

        row.appendChild(bubble);
        messages.appendChild(row);

        if(isNearBottom() || type === "user"){
            scrollToBottom(!opts.skipDayDivider === false);
        } else if(type === "bot"){
            scrollBtn.classList.add("mai-show", "mai-has-new");
        }

        if(!opts.skipSave){
            saveHistoryEntry({
                kind: kind === "image" ? "text" : "text", // images aren't persisted in full to save storage
                content: kind === "image" ? "🖼️ Image" + (opts.caption ? ": " + opts.caption : "") : content,
                type: type,
                date: now.toISOString()
            });
        }

        return { row: row, bubble: bubble, meta: meta };
    }

    function markDelivered(handle){
        if(!handle) return;
        handle.meta.innerHTML += ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    }

    function markFailed(handle, retryFn){
        if(!handle) return;
        handle.bubble.classList.add("mai-failed");
        handle.meta.innerHTML = '<span class="mai-retry">⚠️ Not sent · tap to retry</span>';
        var retry = function(){
            handle.bubble.classList.remove("mai-failed");
            handle.meta.innerHTML = '<span class="mai-meta-time">' + timeLabel(new Date()) + "</span>";
            retryFn();
        };
        handle.bubble.addEventListener("click", retry, { once: true });
    }

    function showTyping(){
        var row = document.createElement("div");
        row.className = "mai-row mai-row-bot";
        row.id = "mai-typing-row";
        var avatar = document.createElement("img");
        avatar.className = "mai-avatar"; avatar.src = LOGO_URL; avatar.alt = "";
        var bubble = document.createElement("div");
        bubble.className = "mai-typing";
        bubble.innerHTML = "<span></span><span></span><span></span>";
        row.appendChild(avatar); row.appendChild(bubble);
        messages.appendChild(row);
        if(isNearBottom()) scrollToBottom();
    }
    function hideTyping(){
        var el = document.getElementById("mai-typing-row");
        if(el) el.remove();
    }

    function renderQuickReplies(){
        var wrap = document.createElement("div");
        wrap.className = "mai-chips";
        QUICK_REPLIES.forEach(function(label){
            var chip = document.createElement("button");
            chip.type = "button";
            chip.className = "mai-chip";
            chip.textContent = label;
            chip.addEventListener("click", function(){
                wrap.remove();
                input.value = label;
                sendMessage();
            });
            wrap.appendChild(chip);
        });
        messages.appendChild(wrap);
        scrollToBottom(false);
    }

    /* ======================================================================
       NETWORK — sending messages
       ====================================================================== */
    function setSending(isSending){
        state.isSending = isSending;
        sendBtn.disabled = isSending;
        input.disabled = isSending;
        uploadBtn.disabled = isSending;
    }

    function refreshSendIcon(){
        var hasContent = input.value.trim().length > 0 || state.stagedImageDataUrl;
        sendBtn.innerHTML = hasContent
            ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h2a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H2v11zM22.16 10.76a2 2 0 0 0-1.5-.76H15l.85-4.3a2.87 2.87 0 0 0-.78-2.57A2.83 2.83 0 0 0 13 2c-.42 0-.83.15-1.15.42a2 2 0 0 0-.55.78L9 8.35V19a2 2 0 0 0 2 2h7.24a2 2 0 0 0 1.94-1.51l2-8a2 2 0 0 0-.02-1z"/></svg>';
    }

    function sendToWebhook(payload, handle){
        if(!navigator.onLine){
            markFailed(handle, function(){ sendToWebhook(payload, handle); });
            return;
        }
        setSending(true);
        showTyping();
        payload.sessionId = SESSION_ID;

        fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function(res){
            if(!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        })
        .then(function(replyText){
            hideTyping();
            markDelivered(handle);
            addMessage("text", replyText || ".", "bot");
            if(!box.classList.contains("mai-open")){
                bumpUnread();
                playNotifySound();
            }
        })
        .catch(function(err){
            console.error("Milestones AI chat error:", err);
            hideTyping();
            markFailed(handle, function(){ sendToWebhook(payload, handle); });
        })
        .finally(function(){
            setSending(false);
            if(!isMobile()) input.focus();
        });
    }

    function sendMessage(){
        if(state.isSending) return;
        var text = input.value.trim();
        var image = state.stagedImageDataUrl;

        if(!text && !image){
            // Empty send = thumbs-up, Messenger-style default action
            var thumbHandle = addMessage("text", "👍", "user");
            sendToWebhook({ type: "text", message: "👍" }, thumbHandle);
            return;
        }

        var handle;
        if(image){
            handle = addMessage("image", image, "user", { caption: text || null });
            sendToWebhook({ type: "image", image: image, message: text || "", filename: state.stagedFileName || "image" }, handle);
            clearStagedImage();
        } else {
            handle = addMessage("text", text, "user");
            sendToWebhook({ type: "text", message: text }, handle);
        }

        input.value = "";
        autoResizeInput();
        refreshSendIcon();
    }

    /* ======================================================================
       IMAGE ATTACHMENTS
       ====================================================================== */
    function clearStagedImage(){
        state.stagedImageDataUrl = null;
        state.stagedFileName = null;
        stagedThumb.src = "";
        stagedWrap.classList.remove("mai-show");
        fileInput.value = "";
        refreshSendIcon();
    }

    function stageImage(file){
        if(!file) return;
        if(!/^image\//.test(file.type)){
            addMessage("text", "⚠️ That file isn't an image. Please attach a JPG, PNG, or similar.", "bot", { skipSave: true });
            return;
        }
        if(file.size > MAX_IMAGE_MB * 1024 * 1024){
            addMessage("text", "⚠️ That image is larger than " + MAX_IMAGE_MB + "MB. Please choose a smaller file.", "bot", { skipSave: true });
            return;
        }
        var reader = new FileReader();
        reader.onload = function(e){
            state.stagedImageDataUrl = e.target.result;
            state.stagedFileName = file.name;
            stagedThumb.src = e.target.result;
            stagedWrap.classList.add("mai-show");
            refreshSendIcon();
            if(!isMobile()) input.focus();
        };
        reader.readAsDataURL(file);
    }

    uploadBtn.addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){ stageImage(fileInput.files[0]); });
    stagedRemove.addEventListener("click", clearStagedImage);

    // Drag & drop an image straight onto the chat window
    ["dragover", "drop"].forEach(function(evt){
        box.addEventListener(evt, function(e){ e.preventDefault(); });
    });
    box.addEventListener("drop", function(e){
        if(e.dataTransfer.files && e.dataTransfer.files[0]) stageImage(e.dataTransfer.files[0]);
    });

    /* ======================================================================
       LIGHTBOX
       ====================================================================== */
    function openLightbox(src){
        lightboxImg.src = src;
        lightbox.classList.add("mai-open");
    }
    function closeLightbox(){
        lightbox.classList.remove("mai-open");
        lightboxImg.src = "";
    }
    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function(e){ if(e.target === lightbox) closeLightbox(); });
    lightboxDownload.addEventListener("click", function(){
        if(!lightboxImg.src) return;
        var a = document.createElement("a");
        a.href = lightboxImg.src;
        a.download = "image.png";
        document.body.appendChild(a); a.click(); a.remove();
    });

    /* ======================================================================
       PANEL OPEN / CLOSE
       ====================================================================== */
    function renderWelcome(){
        var history = loadHistory();
        if(history.length){
            history.forEach(function(entry){
                addMessage("text", entry.content, entry.type, { date: new Date(entry.date), skipSave: true });
            });
        }
        addMessage("text", "👋 Welcome to Milestones!\nHow can I help you today?", "bot", { skipSave: true });
        if(!isWithinWorkingHours()){
            addMessage("text", "🕒 We're currently outside our working hours. Leave a message and we'll reply as soon as we're back online!", "bot", { skipSave: true });
        }
        renderQuickReplies();
    }

    function openChat(){
        state.lastFocusedEl = document.activeElement;
        box.classList.add("mai-open");
        box.setAttribute("aria-hidden", "false");
        toggleBtn.setAttribute("aria-expanded", "true");
        clearUnread();
        hideTeaser();

        if(isMobile()){
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
        } else {
            input.focus();
        }

        if(!state.hasOpenedBefore){
            state.hasOpenedBefore = true;
            renderWelcome();
        }
    }

    function closeChat(){
        box.classList.remove("mai-open");
        box.setAttribute("aria-hidden", "true");
        toggleBtn.setAttribute("aria-expanded", "false");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";
        menu.classList.remove("mai-open");
        closeLightbox();
        if(state.lastFocusedEl) state.lastFocusedEl.focus();
    }

    toggleBtn.addEventListener("click", function(){
        box.classList.contains("mai-open") ? closeChat() : openChat();
    });
    closeBtn.addEventListener("click", closeChat);

    document.addEventListener("keydown", function(e){
        if(e.key !== "Escape") return;
        if(lightbox.classList.contains("mai-open")) closeLightbox();
        else if(menu.classList.contains("mai-open")) menu.classList.remove("mai-open");
        else if(box.classList.contains("mai-open")) closeChat();
    });

    /* ======================================================================
       HEADER MENU
       ====================================================================== */
    menuBtn.addEventListener("click", function(e){
        e.stopPropagation();
        menu.classList.toggle("mai-open");
        menuBtn.setAttribute("aria-expanded", menu.classList.contains("mai-open"));
    });
    document.addEventListener("click", function(e){
        if(!menu.contains(e.target) && e.target !== menuBtn) menu.classList.remove("mai-open");
    });
    clearChatBtn.addEventListener("click", function(){
        menu.classList.remove("mai-open");
        messages.innerHTML = "";
        state.lastRenderedDay = null;
        clearHistory();
        renderWelcome();
    });

    whatsappBtn.addEventListener("click", function(){
        window.open("https://wa.me/" + WHATSAPP_NUMBER, "_blank", "noopener");
    });

    /* ======================================================================
       TEASER BUBBLE
       ====================================================================== */
    function showTeaser(){ if(!state.hasOpenedBefore) teaser.classList.add("mai-show"); }
    function hideTeaser(){
        teaser.classList.remove("mai-show");
        if(state.teaserTimer){ clearTimeout(state.teaserTimer); state.teaserTimer = null; }
    }
    state.teaserTimer = setTimeout(showTeaser, 8000);
    teaser.addEventListener("click", function(){ hideTeaser(); openChat(); });
    teaserClose.addEventListener("click", function(e){ e.stopPropagation(); hideTeaser(); });

    /* ======================================================================
       INPUT BEHAVIOR
       ====================================================================== */
    function autoResizeInput(){
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 116) + "px";
    }
    input.addEventListener("input", function(){ refreshSendIcon(); autoResizeInput(); });
    input.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener("click", sendMessage);

    /* ======================================================================
       OFFLINE / ONLINE DETECTION
       ====================================================================== */
    function refreshConnectionBanner(){
        offlineBanner.classList.toggle("mai-show", !navigator.onLine);
    }
    window.addEventListener("online", refreshConnectionBanner);
    window.addEventListener("offline", refreshConnectionBanner);

    /* ======================================================================
       MOBILE KEYBOARD HANDLING (visualViewport keeps the input above the
       on-screen keyboard instead of letting it get covered)
       ====================================================================== */
    if(window.visualViewport){
        window.visualViewport.addEventListener("resize", function(){
            if(!isMobile() || !box.classList.contains("mai-open")) return;
            var vv = window.visualViewport;
            var keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
            box.style.height = vv.height + "px";
            box.style.transform = "translateY(" + Math.max(0, keyboardHeight > 0 ? 0 : 0) + "px)";
            scrollToBottom(false);
        });
    }

    /* ======================================================================
       INIT
       ====================================================================== */
    function init(){
        // Wire the single logo constant into every spot that needs it.
        document.getElementById("mai-toggle-logo").src = LOGO_URL;
        document.getElementById("mai-header-logo").src = LOGO_URL;
        watermark.style.backgroundImage = "url('" + LOGO_URL + "')";

        refreshStatusIndicator();
        refreshConnectionBanner();
        refreshSendIcon();
        setInterval(refreshStatusIndicator, 60 * 1000);
    }

    init();
})();
</script>
