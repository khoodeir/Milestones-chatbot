<style>
/* ==========================================================================
   1. DESIGN TOKENS
   ========================================================================== */
:root{
    /* Brand (unchanged) */
    --mai-primary:      #29235F;
    --mai-primary-dark: #1B1740;
    --mai-primary-light:#3D3480;
    --mai-accent:       #BED73B;
    --mai-accent-dark:  #A6BE28;

    /* Neutrals */
    --mai-bg:          #ffffff;
    --mai-bot-bubble:  #F4F5F9;
    --mai-text:        #1E1B3A;
    --mai-muted:       #6B6E7B;
    --mai-border:      #E7E8F0;
    --mai-danger:      #E0384A;
    --mai-online:      #31C46E;

    /* Scale */
    --mai-radius-sm: 10px;
    --mai-radius-md: 16px;
    --mai-radius-lg: 22px;
    --mai-radius-pill: 999px;

    --mai-shadow-sm: 0 2px 8px rgba(23, 15, 60, .08);
    --mai-shadow-md: 0 12px 32px rgba(23, 15, 60, .16);
    --mai-shadow-lg: 0 24px 64px rgba(15, 10, 40, .28);

    --mai-ease: cubic-bezier(.22, 1, .36, 1);
    --mai-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Cairo", "Helvetica Neue", sans-serif;
}

@media (prefers-reduced-motion: reduce){
    #mai-root, #mai-root *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* Isolate the widget's layout direction from the host page. Without this,
   embedding on a page with <html dir="rtl"> (common on Arabic sites) flips
   flexbox row order and breaks the avatar/bubble alignment below. Each
   message bubble still gets its own dir="auto" so Arabic/English text
   inside it shapes and aligns correctly regardless of this. */
#mai-root{ direction: ltr; }
#mai-root, #mai-root *{ box-sizing: border-box; font-family: var(--mai-font); }
#mai-root :focus-visible{ outline: 2px solid var(--mai-primary-light); outline-offset: 2px; }

/* ==========================================================================
   2. LAUNCHER BUTTON
   ========================================================================== */
#mai-toggle{
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;
    background: #fff;
    padding: 7px;
    cursor: pointer;
    box-shadow: 0 0 0 3px #fff, var(--mai-shadow-md);
    transition: transform .2s var(--mai-ease), box-shadow .2s var(--mai-ease);
    z-index: 2147483000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: mai-breathe 3.2s ease-in-out infinite;
}
#mai-toggle:hover{ transform: scale(1.06); box-shadow: 0 0 0 3px #fff, 0 16px 40px rgba(23,15,60,.22); animation-play-state: paused; }
#mai-toggle:active{ transform: scale(.96); animation-play-state: paused; }
#mai-toggle img{ width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
#mai-toggle.mai-has-unread{ animation: mai-pulse 1.8s var(--mai-ease) infinite; }

@keyframes mai-breathe{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.05); }
}
@keyframes mai-pulse{
    0%, 100%{ box-shadow: 0 0 0 3px #fff, 0 0 0 0 rgba(190,215,59,.55), var(--mai-shadow-md); }
    50%{      box-shadow: 0 0 0 3px #fff, 0 0 0 9px rgba(190,215,59,0), var(--mai-shadow-md); }
}

#mai-badge{
    position: absolute;
    top: -2px; right: -2px;
    min-width: 21px; height: 21px;
    padding: 0 5px;
    border-radius: 50%;
    background: var(--mai-danger);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2.5px solid #fff;
}

/* Proactive teaser bubble */
#mai-teaser{
    position: fixed;
    right: 96px;
    bottom: 34px;
    max-width: 230px;
    background: #fff;
    color: var(--mai-text);
    padding: 12px 14px;
    border-radius: var(--mai-radius-md);
    box-shadow: var(--mai-shadow-md);
    font-size: 13.5px;
    line-height: 1.45;
    display: none;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    z-index: 2147482999;
}
#mai-teaser.mai-show{ display: flex; animation: mai-teaser-in .45s cubic-bezier(.34, 1.56, .64, 1), mai-teaser-float 2.4s ease-in-out .45s infinite; }
@keyframes mai-rise{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: none; } }
@keyframes mai-teaser-in{
    from{ opacity: 0; transform: translateY(14px) scale(.9); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes mai-teaser-float{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
}
#mai-teaser-close{
    background: none; border: none; color: var(--mai-muted);
    font-size: 13px; cursor: pointer; padding: 3px; flex-shrink: 0; line-height: 1;
}

/* ==========================================================================
   3. PANEL SHELL
   ========================================================================== */
#mai-box{
    position: fixed;
    right: 24px;
    bottom: 96px;
    width: 392px;
    height: 640px;
    max-height: calc(100vh - 130px);
    display: none;
    flex-direction: column;
    background: var(--mai-bg);
    border-radius: var(--mai-radius-lg);
    overflow: hidden;
    box-shadow: var(--mai-shadow-lg);
    z-index: 2147483000;
    opacity: 0;
    transform: translateY(20px) scale(.97);
    transition: opacity .22s var(--mai-ease), transform .22s var(--mai-ease);
}
#mai-box.mai-open{ display: flex; opacity: 1; transform: none; }

/* ==========================================================================
   4. HEADER
   ========================================================================== */
#mai-header{
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px 14px;
    background: linear-gradient(135deg, var(--mai-primary), var(--mai-primary-light));
    color: #fff;
    flex-shrink: 0;
}
.mai-logo{
    width: 40px; height: 40px;
    border-radius: 12px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
}
.mai-logo img{ width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.mai-header-text{ flex: 1; min-width: 0; }
.mai-header-text .mai-title{
    font-size: 15px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mai-status{
    font-size: 12px; color: rgba(255,255,255,.8);
    display: flex; align-items: center; gap: 5px;
}
.mai-status::before{
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--mai-online); flex-shrink: 0;
    animation: mai-dot-pulse 2s ease-in-out infinite;
}
.mai-status.mai-away::before{ background: rgba(255,255,255,.55); animation: mai-dot-pulse-away 2s ease-in-out infinite; }

@keyframes mai-dot-pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(49,196,110,.5); }
    50%{ box-shadow: 0 0 0 4px rgba(49,196,110,0); }
}
@keyframes mai-dot-pulse-away{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(255,255,255,.35); }
    50%{ box-shadow: 0 0 0 4px rgba(255,255,255,0); }
}

.mai-header-btn{
    width: 34px; height: 34px; flex-shrink: 0;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s var(--mai-ease), transform .15s var(--mai-ease);
}
.mai-header-btn:hover{ background: rgba(255,255,255,.26); transform: scale(1.05); }
.mai-header-btn svg{ width: 17px; height: 17px; }

/* Header overflow menu */
#mai-menu-wrap{ position: relative; }
#mai-menu{
    position: absolute;
    top: 42px; right: 0;
    background: #fff;
    border-radius: var(--mai-radius-sm);
    box-shadow: var(--mai-shadow-md);
    min-width: 190px;
    padding: 6px;
    display: none;
    z-index: 5;
}
#mai-menu.mai-open{ display: block; animation: mai-rise .15s var(--mai-ease); }
.mai-menu-item{
    width: 100%; text-align: start;
    background: none; border: none;
    padding: 9px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--mai-text);
    cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.mai-menu-item:hover{ background: var(--mai-bot-bubble); }
.mai-menu-item.mai-danger{ color: var(--mai-danger); }

/* ==========================================================================
   5. OFFLINE BANNER
   ========================================================================== */
#mai-offline-banner{
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: #FFF6E5;
    color: #92620C;
    font-size: 12.5px;
    flex-shrink: 0;
    border-bottom: 1px solid #F5E3B8;
}
#mai-offline-banner.mai-show{ display: flex; }

/* ==========================================================================
   6. MESSAGES AREA
   ========================================================================== */
#mai-messages-wrap{ position: relative; flex: 1; min-height: 0; }
#mai-messages{
    position: absolute; inset: 0;
    padding: 16px 16px 6px;
    overflow-y: auto;
    background: #fff;
    display: flex; flex-direction: column;
    scroll-behavior: smooth;
}
#mai-messages::-webkit-scrollbar{ width: 6px; }
#mai-messages::-webkit-scrollbar-thumb{ background: #DCDCE8; border-radius: 10px; }

#mai-watermark{
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 62%;
    opacity: .06;
    pointer-events: none;
}

.mai-day-divider{
    align-self: center;
    font-size: 11.5px;
    color: var(--mai-muted);
    background: var(--mai-bot-bubble);
    padding: 3px 10px;
    border-radius: var(--mai-radius-pill);
    margin: 10px 0;
}

.mai-row{
    display: flex;
    align-items: flex-end;
    gap: 7px;
    max-width: 100%;
    position: relative;
    margin: 10px 0;
}
.mai-row-user{ justify-content: flex-end; }
.mai-row-bot{ justify-content: flex-start; }
.mai-row.mai-grouped{ margin-top: 4px; }

.mai-avatar{
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 1px solid var(--mai-border);
    padding: 2px; flex-shrink: 0; object-fit: contain;
}
.mai-avatar-spacer{ width: 24px; flex-shrink: 0; }

.mai-msg{
    padding: 9px 13px;
    border-radius: var(--mai-radius-md);
    max-width: 76%;
    line-height: 1.48;
    font-size: 14.5px;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: mai-msg-in .18s var(--mai-ease);
}
@keyframes mai-msg-in{ from{ opacity: 0; transform: translateY(5px); } to{ opacity: 1; transform: none; } }

.mai-user{
    background: linear-gradient(135deg, var(--mai-primary), var(--mai-primary-light));
    color: #fff;
    border-bottom-right-radius: 5px;
}
.mai-bot{
    background: var(--mai-bot-bubble);
    color: var(--mai-text);
    border-bottom-left-radius: 5px;
}
.mai-msg.mai-failed{ background: #FDEAEC; color: var(--mai-danger); cursor: pointer; }

.mai-meta{
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; opacity: .65; margin-top: 3px;
}
.mai-user .mai-meta{ justify-content: flex-end; }
.mai-meta svg{ width: 12px; height: 12px; }
.mai-meta.mai-retry{ color: var(--mai-danger); opacity: 1; text-decoration: underline; cursor: pointer; }

/* Typing indicator */
.mai-typing{
    background: var(--mai-bot-bubble);
    border-bottom-left-radius: 5px;
    padding: 11px 15px;
    border-radius: var(--mai-radius-md);
    display: flex; gap: 4px;
}
.mai-typing span{
    width: 6px; height: 6px; border-radius: 50%;
    background: #9698A6; animation: mai-bounce 1.1s infinite;
}
.mai-typing span:nth-child(2){ animation-delay: .15s; }
.mai-typing span:nth-child(3){ animation-delay: .3s; }
@keyframes mai-bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: .5; }
    30%{ transform: translateY(-5px); opacity: 1; }
}

/* Quick reply chips */
.mai-chips{
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 6px 0 12px 31px;
}
.mai-chip{
    border: 1.5px solid var(--mai-primary);
    color: var(--mai-primary);
    background: #fff;
    border-radius: var(--mai-radius-pill);
    padding: 7px 13px;
    font-size: 12.5px; font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, transform .1s;
    white-space: nowrap;
}
.mai-chip:hover{ background: var(--mai-primary); color: #fff; }
.mai-chip:active{ transform: scale(.96); }

/* Scroll-to-bottom button */
#mai-scroll-btn{
    position: absolute;
    right: 14px; bottom: 14px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #fff;
    color: var(--mai-primary);
    border: 1px solid var(--mai-border);
    box-shadow: var(--mai-shadow-sm);
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
}
#mai-scroll-btn.mai-show{ display: flex; animation: mai-rise .15s var(--mai-ease); }
#mai-scroll-btn .mai-dot{
    position: absolute; top: -2px; right: -2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--mai-danger); border: 1.5px solid #fff; display: none;
}
#mai-scroll-btn.mai-has-new .mai-dot{ display: block; }

/* ==========================================================================
   7. INPUT ROW
   ========================================================================== */
#mai-input-row{
    display: flex; align-items: flex-end; gap: 6px;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid var(--mai-border);
    flex-shrink: 0;
}
#mai-message{
    flex: 1; min-width: 0;
    padding: 10px 16px;
    border-radius: var(--mai-radius-pill);
    border: 1.5px solid var(--mai-border);
    background: #fff;
    font-size: 14.5px;
    outline: none;
    color: var(--mai-text);
    resize: none;
    overflow-y: auto;
    max-height: 116px;
    line-height: 1.4;
    display: block;
    transition: border-color .15s, box-shadow .15s;
}
#mai-message::placeholder{ color: #A1A3AF; }
#mai-message:focus{ border-color: var(--mai-primary); box-shadow: 0 0 0 3px rgba(41,35,95,.10); }
#mai-message:disabled{ background: #F5F5F7; cursor: not-allowed; }

.mai-icon-btn{
    width: 38px; height: 38px; flex-shrink: 0;
    border: none; border-radius: 50%;
    background: none; color: var(--mai-primary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s, opacity .15s;
}
.mai-icon-btn svg{ width: 20px; height: 20px; }
.mai-icon-btn:hover:not(:disabled){ background: var(--mai-bot-bubble); transform: scale(1.05); }
.mai-icon-btn:disabled{ opacity: .45; cursor: not-allowed; }

#mai-send{
    width: 40px; height: 40px; flex-shrink: 0;
    border: none; border-radius: 50%;
    background: var(--mai-primary); color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(41,35,95,.28);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s, opacity .15s;
}
#mai-send svg{ width: 19px; height: 19px; }
#mai-send:hover:not(:disabled){ background: var(--mai-primary-dark); transform: scale(1.06); }
#mai-send:disabled{ opacity: .5; cursor: not-allowed; }

/* ==========================================================================
   8. MOBILE
   ========================================================================== */
@media (max-width: 640px){
    #mai-box{
        right: 0; left: 0; top: 0; bottom: 0;
        width: 100%; height: 100%;
        max-height: none; border-radius: 0;
    }
    #mai-header{
        padding-top: calc(13px + env(safe-area-inset-top));
        padding-left: calc(14px + env(safe-area-inset-left));
        padding-right: calc(14px + env(safe-area-inset-right));
    }
    #mai-messages{
        padding-left: calc(16px + env(safe-area-inset-left));
        padding-right: calc(16px + env(safe-area-inset-right));
    }
    #mai-input-row{
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
        padding-left: calc(12px + env(safe-area-inset-left));
        padding-right: calc(12px + env(safe-area-inset-right));
    }
    #mai-message{ font-size: 16px; } /* prevents iOS auto-zoom on focus */
    .mai-msg{ max-width: 86%; }
    #mai-toggle{ right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); }
    #mai-teaser{ display: none !important; } /* avoid overlap with small screens */
}
</style>

    var MAX_HISTORY      = 60;

    // Quick-reply chips shown alongside the welcome message for first-time

    // array ([]) to disable chips entirely.
    var QUICK_REPLIES = [
        "الأسعار والباقات",
        "أتكلم مع فريق الدعم",
        "الكورسات المتاحة"
    ];

    // Path to your logo image. Must be reachable from the page you embed
    // this on (same folder, or update to an absolute/relative path or a
    // full URL like "https://yourdomain.com/assets/logo.png").
    // It's used for: the launcher icon, the header avatar, and the
    // chat-background watermark.
    var LOGO_URL = "milestones_group_logo.png";

    var SESSION_KEY = "mai_session_id";
    var HISTORY_KEY = "mai_chat_history";

    /* ======================================================================
       DOM REFERENCES
       ====================================================================== */
    var root          = document.getElementById("mai-root");
    var toggleBtn      = document.getElementById("mai-toggle");
    var badge          = document.getElementById("mai-badge");
    var box            = document.getElementById("mai-box");
    var messagesWrap   = document.getElementById("mai-messages-wrap");
    var messages       = document.getElementById("mai-messages");
    var watermark      = document.getElementById("mai-watermark");
    var scrollBtn      = document.getElementById("mai-scroll-btn");
    var input          = document.getElementById("mai-message");
    var sendBtn        = document.getElementById("mai-send");
    var statusEl       = document.getElementById("mai-status");
    var offlineBanner  = document.getElementById("mai-offline-banner");

    var menuBtn        = document.getElementById("mai-menu-btn");
    var menu           = document.getElementById("mai-menu");
    var clearChatBtn   = document.getElementById("mai-clear-chat");
    var whatsappBtn    = document.getElementById("mai-whatsapp");

    var teaser         = document.getElementById("mai-teaser");
    var teaserClose     = document.getElementById("mai-teaser-close");

    /* ======================================================================
       STATE
       ====================================================================== */
    var state = {
        hasOpenedBefore: false,
        isSending: false,
        unreadCount: 0,
        lastFocusedEl: null,
        lastRenderedDay: null,
        teaserTimer: null
    };

    /* ======================================================================
       UTILITIES
       ====================================================================== */
    function escapeHtml(str){
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function linkifyPhones(escapedHtml){
        // Keeps phone numbers left-to-right even inside RTL Arabic text.
        return escapedHtml.replace(/(\+?\d[\d\s\-]{6,}\d)/g,
            '<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">$1</span>');
    }

    function timeLabel(date){
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function dayLabel(date){
        var today = new Date();
        var yest = new Date(); yest.setDate(today.getDate() - 1);
        var sameDay = function(a, b){ return a.toDateString() === b.toDateString(); };
        if(sameDay(date, today)) return "Today";
        if(sameDay(date, yest)) return "Yesterday";
        return date.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function isMobile(){
        return window.matchMedia("(max-width: 640px)").matches;
    }

    /* ======================================================================
       SESSION + HISTORY PERSISTENCE
       ====================================================================== */
    function newSessionId(){
        return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
            "mai-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function getSessionId(){
        try{
            var id = localStorage.getItem(SESSION_KEY);
            if(!id){ id = newSessionId(); localStorage.setItem(SESSION_KEY, id); }
            return id;
        }catch(e){ return newSessionId(); }
    }
    var SESSION_ID = getSessionId();

    function loadHistory(){
        try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
        catch(e){ return []; }
    }

    function saveHistoryEntry(entry){
        try{
            var list = loadHistory();
            list.push(entry);
            if(list.length > MAX_HISTORY) list = list.slice(list.length - MAX_HISTORY);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        }catch(e){ /* storage unavailable — chat still works for this session */ }
    }

    function clearHistory(){
        try{ localStorage.removeItem(HISTORY_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
        SESSION_ID = getSessionId();
    }

    /* ======================================================================
       WORKING HOURS / STATUS
       ====================================================================== */
    function setStatus(isOnline){
        if(isOnline){
            statusEl.textContent = "Active now";
            statusEl.classList.remove("mai-away");
        } else {
            statusEl.textContent = "Leave us a message";
            statusEl.classList.add("mai-away");
        }
    }

    // Pings the backend without waiting for/reading a real response body —
    // mode: "no-cors" means the fetch promise resolves as long as the
    // request reached the server (whatever status code it replies with),
    // and rejects only on an actual network/connection failure. That's
    // enough to tell "system is up" from "system is down".
    function checkSystemStatus(){
        if(!navigator.onLine){ setStatus(false); return; }

        var hasAbort = typeof AbortController !== "undefined";
        var controller = hasAbort ? new AbortController() : null;
        var timeoutId = setTimeout(function(){ if(controller) controller.abort(); }, 6000);

        fetch(WEBHOOK, {
            method: "HEAD",
            mode: "no-cors",
            signal: controller ? controller.signal : undefined
        })
        .then(function(){
            clearTimeout(timeoutId);
            setStatus(true);
        })
        .catch(function(){
            clearTimeout(timeoutId);
            setStatus(false);
        });
    }

    /* ======================================================================
       SOUND + UNREAD BADGE
       ====================================================================== */
    function playNotifySound(){
        try{
            var Ctx = window.AudioContext || window.webkitAudioContext;
            var ctx = new Ctx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.33);
            osc.onended = function(){ if(ctx.close) ctx.close(); };
        }catch(e){}
    }

    function bumpUnread(){
        state.unreadCount++;
        badge.textContent = state.unreadCount > 9 ? "9+" : String(state.unreadCount);
        badge.style.display = "flex";
        toggleBtn.classList.add("mai-has-unread");
    }
    function clearUnread(){
        state.unreadCount = 0;
        badge.style.display = "none";
        toggleBtn.classList.remove("mai-has-unread");
    }

    /* ======================================================================
       SCROLL HANDLING
       ====================================================================== */
    function isNearBottom(){
        return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
    }
    function scrollToBottom(smooth){
        messages.scrollTo({ top: messages.scrollHeight, behavior: smooth === false ? "auto" : "smooth" });
    }
    messages.addEventListener("scroll", function(){
        if(isNearBottom()){
            scrollBtn.classList.remove("mai-show", "mai-has-new");
        } else {
            scrollBtn.classList.add("mai-show");
        }
    });
    scrollBtn.addEventListener("click", function(){ scrollToBottom(true); });

    /* ======================================================================
       MESSAGE RENDERING
       ====================================================================== */
    function maybeInsertDayDivider(date){
        var label = dayLabel(date);
        if(label !== state.lastRenderedDay){
            var div = document.createElement("div");
            div.className = "mai-day-divider";
            div.textContent = label;
            messages.appendChild(div);
            state.lastRenderedDay = label;
        }
    }

    function lastMessageSender(){
        var rows = messages.querySelectorAll(".mai-row");
        if(!rows.length) return null;
        var last = rows[rows.length - 1];
        return last.classList.contains("mai-row-user") ? "user" : "bot";
    }

    // Renders one text message. type: "user" | "bot".
    // Returns the row element so callers can update delivery status later.
    function addMessage(kind, content, type, opts){
        opts = opts || {};
        var now = opts.date || new Date();
        if(!opts.skipDayDivider) maybeInsertDayDivider(now);

        var grouped = lastMessageSender() === type;
        var row = document.createElement("div");
        row.className = "mai-row " + (type === "user" ? "mai-row-user" : "mai-row-bot") + (grouped ? " mai-grouped" : "");

        if(type !== "user"){
            // Only show the avatar on the first message of a consecutive
            // group; grouped follow-ups get a same-width spacer so the
            // bubbles still align, matching common chat-app conventions.
            if(grouped){
                var spacer = document.createElement("span");
                spacer.className = "mai-avatar-spacer";
                row.appendChild(spacer);
            } else {
                var avatar = document.createElement("img");
                avatar.className = "mai-avatar";
                avatar.src = LOGO_URL;
                avatar.alt = "";
                row.appendChild(avatar);
            }
        }

        var bubble = document.createElement("div");
        bubble.className = "mai-msg " + (type === "user" ? "mai-user" : "mai-bot");
        bubble.dir = "auto";

        var textDiv = document.createElement("div");
        var html = linkifyPhones(escapeHtml(content)).replace(/\n/g, "<br>");
        textDiv.innerHTML = html;
        bubble.appendChild(textDiv);

        var meta = document.createElement("div");
        meta.className = "mai-meta";
        meta.innerHTML = '<span class="mai-meta-time">' + timeLabel(now) + "</span>";
        bubble.appendChild(meta);

        row.appendChild(bubble);
        messages.appendChild(row);

        scrollToBottom(true);

        if(!opts.skipSave){
            saveHistoryEntry({
                kind: "text",
                content: content,
                type: type,
                date: now.toISOString()
            });
        }

        return { row: row, bubble: bubble, meta: meta };
    }

    function markDelivered(handle){
        if(!handle) return;
        handle.meta.innerHTML += ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    }

    function markFailed(handle, retryFn){
        if(!handle) return;
        handle.bubble.classList.add("mai-failed");
        handle.meta.innerHTML = '<span class="mai-retry">⚠️ Not sent · tap to retry</span>';
        var retry = function(){
            handle.bubble.classList.remove("mai-failed");
            handle.meta.innerHTML = '<span class="mai-meta-time">' + timeLabel(new Date()) + "</span>";
            retryFn();
        };
        handle.bubble.addEventListener("click", retry, { once: true });
    }

    function showTyping(){
        var row = document.createElement("div");
        row.className = "mai-row mai-row-bot";
        row.id = "mai-typing-row";
        var avatar = document.createElement("img");
        avatar.className = "mai-avatar"; avatar.src = LOGO_URL; avatar.alt = "";
        var bubble = document.createElement("div");
        bubble.className = "mai-typing";
        bubble.innerHTML = "<span></span><span></span><span></span>";
        row.appendChild(avatar); row.appendChild(bubble);
        messages.appendChild(row);
        scrollToBottom();
    }
    function hideTyping(){
        var el = document.getElementById("mai-typing-row");
        if(el) el.remove();
    }

    function renderQuickReplies(){
        if(!QUICK_REPLIES || !QUICK_REPLIES.length) return;
        var wrap = document.createElement("div");
        wrap.className = "mai-chips";
        QUICK_REPLIES.forEach(function(label){
            var chip = document.createElement("button");
            chip.type = "button";
            chip.className = "mai-chip";
            chip.textContent = label;
            chip.addEventListener("click", function(){
                input.value = label;
                sendMessage();
                setTimeout(function(){ wrap.remove(); }, 0);
            });
            wrap.appendChild(chip);
        });
        messages.appendChild(wrap);
        scrollToBottom(false);
    }

    /* ======================================================================
       NETWORK — sending messages
       ====================================================================== */
    function setSending(isSending){
        state.isSending = isSending;
        sendBtn.disabled = isSending;
        input.disabled = isSending;
    }

    function refreshSendIcon(){
        var hasContent = input.value.trim().length > 0;
        sendBtn.innerHTML = hasContent
            ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h2a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H2v11zM22.16 10.76a2 2 0 0 0-1.5-.76H15l.85-4.3a2.87 2.87 0 0 0-.78-2.57A2.83 2.83 0 0 0 13 2c-.42 0-.83.15-1.15.42a2 2 0 0 0-.55.78L9 8.35V19a2 2 0 0 0 2 2h7.24a2 2 0 0 0 1.94-1.51l2-8a2 2 0 0 0-.02-1z"/></svg>';
    }

    function sendToWebhook(payload, handle){
        if(!navigator.onLine){
            markFailed(handle, function(){ sendToWebhook(payload, handle); });
            return;
        }
        setSending(true);
        showTyping();
        payload.sessionId = SESSION_ID;

        fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function(res){
            if(!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        })
        .then(function(replyText){
            hideTyping();
            markDelivered(handle);
            addMessage("text", replyText || ".", "bot");
            if(!box.classList.contains("mai-open")){
                bumpUnread();
                playNotifySound();
            }
        })
        .catch(function(err){
            console.error("Milestones AI chat error:", err);
            hideTyping();
            markFailed(handle, function(){ sendToWebhook(payload, handle); });
        })
        .finally(function(){
            setSending(false);
            if(!isMobile()) input.focus();
        });
    }

    function sendMessage(){
        if(state.isSending) return;
        var text = input.value.trim();

        if(!text){
            // Empty send = thumbs-up, Messenger-style default action
            var thumbHandle = addMessage("text", "👍", "user");
            sendToWebhook({ type: "text", message: "👍" }, thumbHandle);
            return;
        }

        var handle = addMessage("text", text, "user");
        sendToWebhook({ type: "text", message: text }, handle);

        input.value = "";
        autoResizeInput();
        refreshSendIcon();
    }

    /* ======================================================================
       PANEL OPEN / CLOSE
       ====================================================================== */
    function renderWelcome(){
        var history = loadHistory();
        if(history.length){
            history.forEach(function(entry){
                addMessage("text", entry.content, entry.type, { date: new Date(entry.date), skipSave: true });
            });
            return; // returning visitor with saved history — skip the intro & chips
        }
        addMessage("text", "👋 Hi there! Welcome to Milestones.\nHow can we help you today?", "bot", { skipSave: true });
        renderQuickReplies();
    }

    function resetMobileBoxSizing(){
        box.style.height = "";
        box.style.top = "";
    }

    function openChat(){
        state.lastFocusedEl = document.activeElement;
        box.classList.add("mai-open");
        box.setAttribute("aria-hidden", "false");
        toggleBtn.setAttribute("aria-expanded", "true");
        clearUnread();
        hideTeaser();

        if(isMobile()){
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
        } else {
            input.focus();
        }

        if(!state.hasOpenedBefore){
            state.hasOpenedBefore = true;
            renderWelcome();
        }
    }

    function closeChat(){
        box.classList.remove("mai-open");
        box.setAttribute("aria-hidden", "true");
        toggleBtn.setAttribute("aria-expanded", "false");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";
        menu.classList.remove("mai-open");
        resetMobileBoxSizing();
        if(state.lastFocusedEl) state.lastFocusedEl.focus();
    }

    toggleBtn.addEventListener("click", function(e){
        e.stopPropagation();
        box.classList.contains("mai-open") ? closeChat() : openChat();
    });

    // Click anywhere outside the chat panel (and outside the launcher
    // button) closes the chat automatically. Clicks inside the panel
    // never close it.
    //
    // We track where the *gesture* (mousedown/touchstart) began, not just
    // where the eventual "click" lands. On mobile, tapping a button while
    // the keyboard is open often triggers a keyboard-dismiss + viewport
    // resize in the same instant — the panel can shift underneath your
    // finger between touch-down and touch-up, so the browser's synthesized
    // click can end up targeting something outside the panel even though
    // you tapped a button inside it (e.g. Send). Recording the gesture's
    // start prevents that from ever closing the chat by mistake.
    var maiGestureStartedInBox = false;
    box.addEventListener("mousedown", function(){ maiGestureStartedInBox = true; });
    box.addEventListener("touchstart", function(){ maiGestureStartedInBox = true; }, { passive: true });

    document.addEventListener("click", function(e){
        if(!box.classList.contains("mai-open")) return;
        if(maiGestureStartedInBox){ maiGestureStartedInBox = false; return; }
        if(box.contains(e.target)) return;
        closeChat();
    });

    document.addEventListener("keydown", function(e){
        if(e.key !== "Escape") return;
        if(menu.classList.contains("mai-open")) menu.classList.remove("mai-open");
        else if(box.classList.contains("mai-open")) closeChat();
    });

    /* ======================================================================
       HEADER MENU
       ====================================================================== */
    menuBtn.addEventListener("click", function(e){
        e.stopPropagation();
        menu.classList.toggle("mai-open");
        menuBtn.setAttribute("aria-expanded", menu.classList.contains("mai-open"));
    });
    document.addEventListener("click", function(e){
        if(!menu.contains(e.target) && e.target !== menuBtn) menu.classList.remove("mai-open");
    });
    clearChatBtn.addEventListener("click", function(){
        menu.classList.remove("mai-open");
        messages.innerHTML = "";
        state.lastRenderedDay = null;
        clearHistory();
        renderWelcome();
    });

    whatsappBtn.addEventListener("click", function(){
        window.open("https://wa.me/" + WHATSAPP_NUMBER, "_blank", "noopener");
    });

    /* ======================================================================
       TEASER BUBBLE
       ====================================================================== */
    function showTeaser(){ if(!state.hasOpenedBefore) teaser.classList.add("mai-show"); }
    function hideTeaser(){
        teaser.classList.remove("mai-show");
        if(state.teaserTimer){ clearTimeout(state.teaserTimer); state.teaserTimer = null; }
    }
    state.teaserTimer = setTimeout(showTeaser, 8000);
    teaser.addEventListener("click", function(e){ e.stopPropagation(); hideTeaser(); openChat(); });
    teaserClose.addEventListener("click", function(e){ e.stopPropagation(); hideTeaser(); });

    /* ======================================================================
       INPUT BEHAVIOR
       ====================================================================== */
    function autoResizeInput(){
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 116) + "px";
    }
    input.addEventListener("input", function(){ refreshSendIcon(); autoResizeInput(); });
    input.addEventListener("keydown", function(e){
        // isComposing guards against sending mid-keystroke while an IME
        // (Chinese/Japanese/Korean input, etc.) is still composing the word.
        if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener("click", sendMessage);

    /* ======================================================================
       OFFLINE / ONLINE DETECTION
       ====================================================================== */
    function refreshConnectionBanner(){
        offlineBanner.classList.toggle("mai-show", !navigator.onLine);
    }
    window.addEventListener("online", function(){ refreshConnectionBanner(); checkSystemStatus(); });
    window.addEventListener("offline", function(){ refreshConnectionBanner(); setStatus(false); });

    /* ======================================================================
       MOBILE KEYBOARD HANDLING (visualViewport keeps the input above the
       on-screen keyboard instead of letting it get covered)
       ====================================================================== */
    if(window.visualViewport){
        window.visualViewport.addEventListener("resize", function(){
            if(!isMobile() || !box.classList.contains("mai-open")){
                resetMobileBoxSizing();
                return;
            }
            var vv = window.visualViewport;
            // Shrink/reposition the panel to match the visible area so the
            // input row stays above the on-screen keyboard instead of
            // being covered by it.
            box.style.top = vv.offsetTop + "px";
            box.style.height = vv.height + "px";
            scrollToBottom(false);
        });
    }

    // Safety net: if the viewport crosses back over the mobile breakpoint
    // (e.g. rotating a tablet, or resizing a desktop browser window) while
    // stale inline sizing is still applied, clear it so the CSS takes over.
    window.addEventListener("resize", function(){
        if(!isMobile()) resetMobileBoxSizing();
    });

    /* ======================================================================
       INIT
       ====================================================================== */
    function init(){
        // Wire the single logo constant into every spot that needs it.
        document.getElementById("mai-toggle-logo").src = LOGO_URL;
        document.getElementById("mai-header-logo").src = LOGO_URL;
        watermark.style.backgroundImage = "url('" + LOGO_URL + "')";

        refreshConnectionBanner();
        refreshSendIcon();
        checkSystemStatus();
        setInterval(checkSystemStatus, STATUS_CHECK_INTERVAL);
    }

    init();
})();
</script>
