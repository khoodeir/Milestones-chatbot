#mai-toggle{
    position:fixed;
    right:25px;
    bottom:25px;
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,var(--mai-primary),var(--mai-primary-light));
    color:#fff;
    font-size:26px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,132,255,.4);
    transition:transform .25s ease, box-shadow .25s ease;
    z-index:2147483647;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
#mai-toggle:hover{
    transform:scale(1.08);
    box-shadow:0 14px 32px rgba(0,132,255,.5);
}
#mai-toggle:active{ transform:scale(.96); }
#mai-toggle img{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#fff;
    padding:4px;
    object-fit:contain;
}

#mai-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    background:#ef4444;
    color:#fff;
    font-size:11px;
    font-weight:700;
    min-width:20px;
    height:20px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    border:2px solid #fff;
    padding:0 4px;
}

#mai-box{
    position:fixed;
    right:25px;
    bottom:98px;
    width:380px;
    height:620px;
    max-height:calc(100vh - 130px);
    display:none;
    flex-direction:column;
    background:var(--mai-bg);
    border-radius:var(--mai-radius);
    overflow:hidden;
    box-shadow:0 25px 60px rgba(20,10,50,.22);
    z-index:2147483647;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Cairo",sans-serif;
    opacity:0;
    transform:translateY(24px) scale(.96);
    transition:opacity .22s ease, transform .22s ease;
}
#mai-box.mai-open{
    display:flex;
    opacity:1;
    transform:none;
}

/* ---------------- header (Messenger style: light, avatar, active status) ---------------- */
#mai-header{
    padding:12px 16px;
    background:#ffffff;
    color:var(--mai-text);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
    border-bottom:1px solid #e4e6eb;
}
.mai-logo{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff;
    border:1px solid #e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
}
.mai-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:3px;
}
.mai-header-title{
    display:flex;
    flex-direction:column;
    flex:1;
    min-width:0;
    overflow:hidden;
}
.mai-header-title span:first-child{
    font-size:15.5px;
    font-weight:700;
    color:var(--mai-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.mai-status{
    font-size:12.5px;
    color:#65676b;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.mai-status::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:#31a24c;
    flex-shrink:0;
}
#mai-close{
    background:#f0f2f5;
    border:none;
    color:#65676b;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:15px;
    flex-shrink:0;
    transition:background .2s;
}
#mai-close:hover{ background:#e4e6eb; }

#mai-whatsapp{
    background:#f0f2f5;
    border:none;
    color:#25D366;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s, transform .2s;
}
#mai-whatsapp:hover{ background:#e4e6eb; transform:scale(1.06); }

.mai-status.mai-away::before{ background:#8a8d91; }

/* ---------------- messages area + logo watermark ---------------- */
#mai-messages{
    flex:1;
    padding:18px;
    overflow-y:auto;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    gap:3px;
    position:relative;
}
#mai-messages::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:var(--mai-logo-url);
    background-repeat:no-repeat;
    background-position:center;
    background-size:60%;
    opacity:.05;
    pointer-events:none;
    z-index:0;
}
#mai-messages::-webkit-scrollbar{ width:6px; }
#mai-messages::-webkit-scrollbar-thumb{
    background:#d5d5e0;
    border-radius:10px;
}

/* row wrapper: lets us show a small avatar next to bot bubbles, Messenger style */
.mai-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
    max-width:100%;
    position:relative;
    z-index:1;
    margin:3px 0;
}
.mai-row-user{ justify-content:flex-end; }
.mai-row-bot{ justify-content:flex-start; }
.mai-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    object-fit:contain;
    background:#fff;
    border:1px solid #e4e6eb;
    flex-shrink:0;
    padding:2px;
}
.mai-avatar-spacer{ width:26px; flex-shrink:0; }

.mai-msg{
    padding:9px 14px;
    border-radius:var(--mai-radius);
    max-width:78%;
    line-height:1.45;
    font-size:14.5px;
    word-wrap:break-word;
    white-space:pre-wrap;
    animation:mai-fade .18s ease;
}
@keyframes mai-fade{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
}

.mai-user{
    background:linear-gradient(135deg,var(--mai-primary),var(--mai-primary-light));
    color:#fff;
    border-bottom-right-radius:4px;
}
.mai-bot{
    background:var(--mai-bot-bubble);
    color:var(--mai-text);
    border-bottom-left-radius:4px;
}
.mai-time{
    font-size:10px;
    opacity:.55;
    margin-top:3px;
    text-align:right;
}
.mai-bot .mai-time{ text-align:left; }

/* ---------------- image bubble (professional) ---------------- */
.mai-msg .mai-image-wrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    line-height:0;
    box-shadow:0 4px 14px rgba(20,10,50,.15);
}
.mai-msg .mai-image-wrap img.mai-img{
    display:block;
    width:100%;
    max-width:220px;
    max-height:250px;
    object-fit:cover;
    transition:transform .35s ease;
}
.mai-image-wrap:hover img.mai-img{
    transform:scale(1.04);
}
.mai-image-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
    opacity:0;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    padding:8px;
    transition:opacity .2s ease;
}
.mai-image-wrap:hover .mai-image-overlay{ opacity:1; }
.mai-image-overlay span{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    color:var(--mai-primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

/* ---------------- lightbox ---------------- */
#mai-lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,8,20,.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2147483647;
    padding:30px;
}
#mai-lightbox.mai-lightbox-open{ display:flex; }
#mai-lightbox img{
    max-width:90vw;
    max-height:85vh;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.mai-lightbox-btn{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s;
}
.mai-lightbox-btn:hover{ background:rgba(255,255,255,.25); }
#mai-lightbox-close{ top:20px; right:20px; }
#mai-lightbox-download{ top:20px; right:74px; }

/* ---------------- custom voice player ---------------- */
.mai-audio-player{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:210px;
}
.mai-play-btn{
    width:32px;
    height:32px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:var(--mai-primary);
    color:#fff;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s;
}
.mai-user .mai-play-btn{
    background:#fff;
    color:var(--mai-primary);
}
.mai-play-btn:hover{ transform:scale(1.08); }

.mai-wave-wrap{
    position:relative;
    flex:1;
    height:24px;
    display:flex;
    align-items:center;
    cursor:pointer;
    overflow:hidden;
}
.mai-wave-bg, .mai-wave-fg{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:center;
    gap:2.5px;
    pointer-events:none;
}
.mai-wave-bg{ width:100%; }
.mai-wave-fg{ width:0%; overflow:hidden; }

.mai-bar{
    width:3px;
    border-radius:2px;
    background:#d6d1ee;
    flex-shrink:0;
    transition:height .15s ease;
}
.mai-bot .mai-wave-bg .mai-bar{ background:#d8dade; }
.mai-bot .mai-wave-fg .mai-bar{ background:var(--mai-primary); }
.mai-user .mai-wave-bg .mai-bar{ background:rgba(255,255,255,.4); }
.mai-user .mai-wave-fg .mai-bar{ background:#fff; }

.mai-audio-time{
    font-size:11px;
    opacity:.75;
    flex-shrink:0;
    min-width:32px;
}

.mai-speed-btn, .mai-dl-btn{
    flex-shrink:0;
    border:none;
    cursor:pointer;
    background:rgba(0,132,255,.1);
    color:var(--mai-primary);
    font-size:11px;
    font-weight:700;
    border-radius:10px;
    height:22px;
    padding:0 6px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.mai-dl-btn{ width:22px; padding:0; font-size:12px; }
.mai-user .mai-speed-btn, .mai-user .mai-dl-btn{
    background:rgba(255,255,255,.22);
    color:#fff;
}
.mai-speed-btn:hover, .mai-dl-btn:hover{ opacity:.8; }

/* typing indicator */
.mai-typing{
    background:var(--mai-bot-bubble);
    border-bottom-left-radius:4px;
    padding:11px 15px;
    border-radius:var(--mai-radius);
    display:flex;
    gap:4px;
}
.mai-typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#8d8f93;
    animation:mai-bounce 1.1s infinite;
}
.mai-typing span:nth-child(2){ animation-delay:.15s; }
.mai-typing span:nth-child(3){ animation-delay:.3s; }
@keyframes mai-bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-5px); opacity:1; }
}

/* ---------------- input row (Messenger style pill) ---------------- */
#mai-input-row{
    display:flex;
    align-items:center;
    padding:10px 12px;
    background:#fff;
    gap:6px;
    border-top:1px solid #e4e6eb;
    flex-shrink:0;
}
#mai-message{
    flex:1;
    min-width:0;
    padding:10px 16px;
    border-radius:24px;
    border:none;
    background:#f0f2f5;
    font-size:14.5px;
    outline:none;
    font-family:inherit;
    color:var(--mai-text);
    transition:background .2s;
}
#mai-message:focus{ background:#e9ebef; }
#mai-message:disabled{ background:#f5f5f5; cursor:not-allowed; }

.mai-icon-btn{
    width:38px;
    height:38px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:none;
    color:var(--mai-primary);
    font-size:19px;
    cursor:pointer;
    transition:transform .2s, background .2s, opacity .2s;
    display:flex;
    align-items:center;
    justify-content:center;
}
.mai-icon-btn:hover:not(:disabled){ background:#f0f2f5; transform:scale(1.06); }
.mai-icon-btn:disabled{ opacity:.5; cursor:not-allowed; }
.mai-icon-btn.mai-recording{
    background:#ef4444;
    color:#fff;
    animation:mai-pulse 1.2s infinite;
}
@keyframes mai-pulse{
    0%{ box-shadow:0 0 0 0 rgba(239,68,68,.5); }
    70%{ box-shadow:0 0 0 9px rgba(239,68,68,0); }
    100%{ box-shadow:0 0 0 0 rgba(239,68,68,0); }
}

#mai-send{
    width:38px;
    height:38px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:none;
    color:var(--mai-primary);
    font-size:22px;
    cursor:pointer;
    transition:transform .2s, opacity .2s;
    display:flex;
    align-items:center;
    justify-content:center;
}
#mai-send:hover:not(:disabled){ transform:scale(1.1); }
#mai-send:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

/* recording bar replaces the text input while recording */
#mai-recording-bar{
    display:none;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    padding:0 14px;
    height:40px;
    border-radius:24px;
    background:#fff5f5;
    border:1px solid #fecaca;
    color:#b91c1c;
    font-size:13.5px;
    font-weight:600;
}
#mai-recording-bar.mai-show{ display:flex; }
.mai-rec-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ef4444;
    animation:mai-pulse 1.2s infinite;
    flex-shrink:0;
}
#mai-rec-timer{ flex-shrink:0; min-width:34px; }
#mai-rec-cancel{
    margin-inline-start:auto;
    background:none;
    border:none;
    color:#b91c1c;
    font-size:15px;
    cursor:pointer;
    flex-shrink:0;
}


/* ---------------- proactive teaser bubble (near the launcher) ---------------- */
#mai-teaser{
    position:fixed;
    right:96px;
    bottom:38px;
    max-width:220px;
    background:#fff;
    color:var(--mai-text);
    padding:12px 16px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(20,10,50,.18);
    font-size:13.5px;
    line-height:1.4;
    display:none;
    align-items:center;
    gap:8px;
    cursor:pointer;
    z-index:2147483646;
    animation:mai-fade .25s ease;
}
#mai-teaser.mai-show{ display:flex; }
#mai-teaser-close{
    background:none;
    border:none;
    color:#8a8d91;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
    padding:2px;
}

/* ---------------- quick reply chips ---------------- */
.mai-quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:4px 0 10px 32px;
    position:relative;
    z-index:1;
}
.mai-chip{
    border:1.5px solid var(--mai-primary);
    color:var(--mai-primary);
    background:#fff;
    border-radius:16px;
    padding:7px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, color .15s;
    white-space:nowrap;
}
.mai-chip:hover{ background:var(--mai-primary); color:#fff; }

@media (max-width:640px){
    #mai-box{
        right:0;
        left:0;
        top:0;
        bottom:0;
        width:100%;
        height:100vh;
        height:100dvh;
        max-height:none;
        border-radius:0;
    }
    #mai-header{
        padding-top:calc(12px + env(safe-area-inset-top));
        padding-left:calc(16px + env(safe-area-inset-left));
        padding-right:calc(16px + env(safe-area-inset-right));
    }
    #mai-close{
        width:38px;
        height:38px;
        font-size:16px;
    }
    #mai-messages{
        padding-left:calc(18px + env(safe-area-inset-left));
        padding-right:calc(18px + env(safe-area-inset-right));
    }
    #mai-input-row{
        padding-bottom:calc(10px + env(safe-area-inset-bottom));
        padding-left:calc(12px + env(safe-area-inset-left));
        padding-right:calc(12px + env(safe-area-inset-right));
    }
    /* 16px prevents iOS Safari from auto-zooming the page when the field is focused */
    #mai-message{
        font-size:16px;
    }
    .mai-icon-btn, #mai-send{
        width:42px;
        height:42px;
    }
    .mai-msg{
        max-width:85%;
    }
    #mai-toggle{
        right:16px;
        bottom:calc(16px + env(safe-area-inset-bottom));
    }
}
</style>

    function escapeHtml(str){
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function fmtTime(sec){
        if(!isFinite(sec) || sec < 0) sec = 0;
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
    }

    // ---------------- session id (so the n8n AI Agent can keep context across messages) ----------------
    function getSessionId(){
        try{
            var id = localStorage.getItem(SESSION_KEY);
            if(!id){
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
                    "mai-" + Date.now() + "-" + Math.random().toString(16).slice(2);
                localStorage.setItem(SESSION_KEY, id);
            }
            return id;
        }catch(e){
            return "mai-" + Date.now();
        }
    }
    var SESSION_ID = getSessionId();

    // ---------------- working hours ----------------
    function isWithinWorkingHours(){
        var now = new Date();
        var day = now.getDay();
        var hour = now.getHours();
        return WORKING_HOURS.days.indexOf(day) !== -1 && hour >= WORKING_HOURS.start && hour < WORKING_HOURS.end;
    }

    function updateStatusIndicator(){
        if(!statusEl) return;
        if(isWithinWorkingHours()){
            statusEl.textContent = "Active now";
            statusEl.classList.remove("mai-away");
        } else {
            statusEl.textContent = "Away \u2014 we'll reply soon";
            statusEl.classList.add("mai-away");
        }
    }

    // ---------------- chat history persistence (localStorage) ----------------
    function saveHistoryEntry(entry){
        try{
            var raw = localStorage.getItem(HISTORY_KEY);
            var list = raw ? JSON.parse(raw) : [];
            list.push(entry);
            if(list.length > MAX_HISTORY_MESSAGES){
                list = list.slice(list.length - MAX_HISTORY_MESSAGES);
            }
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        }catch(e){
            // storage full or unavailable - fail silently, chat still works for this session
        }
    }

    function loadHistory(){
        try{
            var raw = localStorage.getItem(HISTORY_KEY);
            if(!raw) return [];
            return JSON.parse(raw) || [];
        }catch(e){
            return [];
        }
    }

    // ---------------- simple notification beep (no external audio file needed) ----------------
    function playNotifySound(){
        try{
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            var ctx = new AudioCtx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.33);
            osc.onended = function(){ if(ctx.close) ctx.close(); };
        }catch(e){}
    }

    // ---------------- unread badge ----------------
    function bumpUnread(){
        unreadCount++;
        badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
        badge.style.display = "flex";
    }
    function clearUnread(){

    // ---------------- proactive teaser bubble ----------------
    function showTeaser(){
        if(hasOpenedBefore) return;

    }
    function hideTeaser(){
        teaser.classList.remove("mai-show");
        if(teaserTimeoutId){ clearTimeout(teaserTimeoutId); teaserTimeoutId = null; }

    teaserTimeoutId = setTimeout(showTeaser, 8000);
    teaser.addEventListener("click", function(){

    whatsappBtn.addEventListener("click", function(){

    // ---------------- quick reply chips ----------------
    function renderQuickReplies(){

    // ---------------- lightbox ----------------

    // ---------------- waveform peaks (best effort) ----------------
    function getAudioPeaks(dataUrl, barCount){
        return fetch(dataUrl)
            .then(function(r){ return r.arrayBuffer(); })
            .then(function(buf){
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                var ctx = new AudioCtx();
                return ctx.decodeAudioData(buf).then(function(audioBuffer){
                    var data = audioBuffer.getChannelData(0);
                    var blockSize = Math.max(1, Math.floor(data.length / barCount));
                    var peaks = [];
                    for(var i = 0; i < barCount; i++){
                        var start = i * blockSize;
                        var max = 0;
                        for(var j = 0; j < blockSize; j++){
                            var v = Math.abs(data[start + j] || 0);
                            if(v > max) max = v;
                        }
                        peaks.push(max);
                    }
                    var maxPeak = Math.max.apply(null, peaks) || 1;
                    var normalized = peaks.map(function(p){ return p / maxPeak; });
                    if(ctx.close) ctx.close();
                    return normalized;
                });
            });
    }

    // ---------------- custom voice player ----------------
    function buildAudioPlayer(dataUrl){
        var wrap = document.createElement("div");
        wrap.className = "mai-audio-player";

        var playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "mai-play-btn";
        playBtn.innerHTML = "&#9654;";
        playBtn.setAttribute("aria-label", "Play voice message");

        var waveWrap = document.createElement("div");
        waveWrap.className = "mai-wave-wrap";

        var waveBg = document.createElement("div");
        waveBg.className = "mai-wave-bg";
        var waveFg = document.createElement("div");
        waveFg.className = "mai-wave-fg";

        var bgBars = [], fgBars = [];
        for(var i = 0; i < WAVE_BARS; i++){
            var b1 = document.createElement("span");
            b1.className = "mai-bar";
            b1.style.height = "5px";
            waveBg.appendChild(b1);
            bgBars.push(b1);

            var b2 = document.createElement("span");
            b2.className = "mai-bar";
            b2.style.height = "5px";
            waveFg.appendChild(b2);
            fgBars.push(b2);
        }

        waveWrap.appendChild(waveBg);
        waveWrap.appendChild(waveFg);

        var timeEl = document.createElement("span");
        timeEl.className = "mai-audio-time";
        timeEl.textContent = "0:00";

        var speedBtn = document.createElement("button");
        speedBtn.type = "button";
        speedBtn.className = "mai-speed-btn";
        speedBtn.textContent = "1x";

        var dlBtn = document.createElement("button");
        dlBtn.type = "button";
        dlBtn.className = "mai-dl-btn";
        dlBtn.innerHTML = "&#11015;";
        dlBtn.setAttribute("aria-label", "Download voice message");

        wrap.appendChild(playBtn);
        wrap.appendChild(waveWrap);
        wrap.appendChild(timeEl);
        wrap.appendChild(speedBtn);
        wrap.appendChild(dlBtn);

        var audio = new Audio(dataUrl);
        audio.preload = "metadata";

        var duration = 0;
        var speeds = [1, 1.5, 2];
        var speedIdx = 0;

        function setProgress(ratio){
            ratio = Math.max(0, Math.min(1, ratio));
            waveFg.style.width = (ratio * 100) + "%";
        }

        playBtn.addEventListener("click", function(){
            if(audio.paused){
                audio.play().catch(function(){});
            } else {
                audio.pause();
            }
        });

        audio.addEventListener("play", function(){ playBtn.innerHTML = "&#9208;"; });
        audio.addEventListener("pause", function(){ playBtn.innerHTML = "&#9654;"; });
        audio.addEventListener("ended", function(){
            playBtn.innerHTML = "&#9654;";
            setProgress(0);
            timeEl.textContent = fmtTime(duration);
        });
        audio.addEventListener("loadedmetadata", function(){
            if(isFinite(audio.duration) && audio.duration > 0){
                duration = audio.duration;
                timeEl.textContent = fmtTime(duration);
            }
        });
        audio.addEventListener("timeupdate", function(){
            if(duration > 0){
                setProgress(audio.currentTime / duration);
                timeEl.textContent = fmtTime(duration - audio.currentTime);
            }
        });

        waveWrap.addEventListener("click", function(e){
            if(!duration) return;
            var rect = waveWrap.getBoundingClientRect();
            var ratio = (e.clientX - rect.left) / rect.width;
            audio.currentTime = ratio * duration;
            setProgress(ratio);
        });

        speedBtn.addEventListener("click", function(){
            speedIdx = (speedIdx + 1) % speeds.length;
            audio.playbackRate = speeds[speedIdx];
            speedBtn.textContent = speeds[speedIdx] + "x";
        });

        dlBtn.addEventListener("click", function(){
            var a = document.createElement("a");
            a.href = dataUrl;
            a.download = "voice-message.webm";
            document.body.appendChild(a);
            a.click();
            a.remove();
        });

        getAudioPeaks(dataUrl, WAVE_BARS).then(function(peaks){
            peaks.forEach(function(p, idx){
                var h = Math.max(4, Math.round(p * WAVE_MAX_HEIGHT));
                bgBars[idx].style.height = h + "px";
                fgBars[idx].style.height = h + "px";
            });
        }).catch(function(){
            bgBars.forEach(function(b, idx){
                var h = 6 + Math.round(Math.sin(idx * 0.9) * 6 + 6);
                b.style.height = h + "px";
                fgBars[idx].style.height = h + "px";
            });
        });

        return wrap;
    }

    // kind: "text" | "image" | "audio"
    function addMessage(kind, content, type, skipSave){
        var row = document.createElement("div");
        row.className = "mai-row " + (type === "user" ? "mai-row-user" : "mai-row-bot");

        if(type !== "user"){
            var avatar = document.createElement("img");
            avatar.className = "mai-avatar";
            avatar.src = LOGO_URL;
            avatar.alt = "";
            row.appendChild(avatar);
        }

        var div = document.createElement("div");
        div.className = "mai-msg " + (type === "user" ? "mai-user" : "mai-bot");
        div.dir = "auto";

        if(kind === "image"){
            var imgWrap = document.createElement("div");
            imgWrap.className = "mai-image-wrap";

            var img = document.createElement("img");
            img.className = "mai-img";
            img.src = content;
            img.alt = "Sent image";

            var overlay = document.createElement("div");
            overlay.className = "mai-image-overlay";
            overlay.innerHTML = "<span>&#128269;</span>";

            imgWrap.appendChild(img);
            imgWrap.appendChild(overlay);
            imgWrap.addEventListener("click", function(){ openLightbox(content); });

            div.appendChild(imgWrap);
        } else if(kind === "audio"){
            div.appendChild(buildAudioPlayer(content));
        } else {
            var textDiv = document.createElement("div");
            textDiv.innerHTML = escapeHtml(content).replace(/\n/g, "<br>");
            div.appendChild(textDiv);
        }

        var timeLabel = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        var timeDiv = document.createElement("div");
        timeDiv.className = "mai-time";
        timeDiv.textContent = timeLabel;
        div.appendChild(timeDiv);

        row.appendChild(div);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;

        if(!skipSave){
            // Images/audio aren't persisted in full (storage size) - keep a lightweight placeholder instead
            var histKind = kind === "text" ? "text" : "text";
            var histContent = kind === "image" ? "\uD83D\uDDBC\uFE0F Image" :
                               kind === "audio" ? "\uD83C\uDFA4 Voice message" : content;
            saveHistoryEntry({ kind: histKind, content: histContent, type: type, time: timeLabel });
        }
    }

    function showTyping(){
        var row = document.createElement("div");
        row.className = "mai-row mai-row-bot";
        row.id = "mai-typing-indicator";

        var avatar = document.createElement("img");
        avatar.className = "mai-avatar";
        avatar.src = LOGO_URL;
        avatar.alt = "";
        row.appendChild(avatar);

        var el = document.createElement("div");
        el.className = "mai-typing";
        el.innerHTML = "<span></span><span></span><span></span>";
        row.appendChild(el);

        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping(){
        var el = document.getElementById("mai-typing-indicator");
        if(el) el.remove();
    }

    function isMobile(){
        return window.matchMedia("(max-width:640px)").matches;
    }

    function openChat(){
        box.classList.add("mai-open");
        clearUnread();
        hideTeaser();
        if(isMobile()){
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
        } else {
            input.focus();
        }
        if(!hasOpenedBefore){
            hasOpenedBefore = true;

            var savedHistory = loadHistory();

            if(savedHistory.length > 0){
                // اليوزر ده زار الشات قبل كده - اعرض المحادثة السابقة بدل رسالة الترحيب
                savedHistory.forEach(function(entry){
                    addMessage(entry.kind || "text", entry.content, entry.type, true);
                });
            } else {
                addMessage(
    "text",
    "👋 Welcome to Milestones!\nHow can I help you today?",
    "bot"
);
                if(!isWithinWorkingHours()){
                    addMessage("text", "\u{1F550} We're currently outside our working hours. Leave us a message and we'll get back to you as soon as we're back online!", "bot");
                }
                renderQuickReplies();
            }
        }
    }

    function closeChat(){
        box.classList.remove("mai-open");
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";
    }

    toggle.addEventListener("click", function(){
        if(box.classList.contains("mai-open")){
            closeChat();
        } else {
            openChat();
        }
    });

    closeBtn.addEventListener("click", closeChat);

    function setSending(state){
        isSending = state;
        sendBtn.disabled = state;
        input.disabled = state;
        micBtn.disabled = state;
    }

    // ---- core: send any payload (text / image / voice) to the webhook ----
    function sendToWebhook(payload){
        setSending(true);
        showTyping();

        payload.sessionId = SESSION_ID;

        fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);

    var contentType = res.headers.get("content-type") || "";

    if(contentType.startsWith("audio/")){
        return res.blob().then(function(blob){
            return {
                type: "audio",
                data: URL.createObjectURL(blob)
            };
        });
    }

    return res.text().then(function(text){
        return {
            type: "text",
            data: text
        };
    });
})
.then(function(reply){
    hideTyping();

    if(reply.type === "audio"){
        addMessage("audio", reply.data, "bot");
    } else {
        addMessage("text", reply.data || ".", "bot");
    }
            if(!box.classList.contains("mai-open")){
                bumpUnread();
                playNotifySound();
            }
        })
        .catch(function(err){
            console.error("Milestones AI chat error:", err);
            hideTyping();
            addMessage("text", "\u26A0\uFE0F Couldn't reach the server. Please try again in a moment.", "bot");
        })
        .finally(function(){
            setSending(false);
            input.focus();
        });
    }

    // ---- text (or thumbs-up quick send, Messenger style) ----
    function sendTextMessage(){
        if(isSending) return;
        var text = input.value.trim();

        if(!text){
            // thumbs-up quick send, like Messenger's default send button
            addMessage("text", "\u{1F44D}", "user");
            sendToWebhook({ type: "text", message: "\u{1F44D}" });
            return;
        }

        addMessage("text", text, "user");
        input.value = "";
        refreshSendButton();

        sendToWebhook({ type: "text", message: text });
    }

    sendBtn.addEventListener("click", sendTextMessage);
    input.addEventListener("keypress", function(e){
        if(e.key === "Enter"){
            e.preventDefault();
            sendTextMessage();
        }
    });

    // ---- voice ----
    function startRecording(){
        if(!navigator.mediaDevices || !window.MediaRecorder){
            addMessage("text", "\u26A0\uFE0F Voice messages aren't supported in this browser.", "bot");
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream){
            recordedChunks = [];
            recordCancelled = false;

            var mimeType = MediaRecorder.isTypeSupported("audio/webm")
                ? "audio/webm"
                : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");

            mediaRecorder = mimeType
                ? new MediaRecorder(stream, { mimeType: mimeType })
                : new MediaRecorder(stream);

            mediaRecorder.addEventListener("dataavailable", function(e){
                if(e.data && e.data.size > 0) recordedChunks.push(e.data);
            });

            mediaRecorder.addEventListener("stop", function(){
                stream.getTracks().forEach(function(t){ t.stop(); });

                if(recordCancelled || recordedChunks.length === 0) return;

                var blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
                var reader = new FileReader();
                reader.onload = function(){
                    var dataUrl = reader.result;
                    addMessage("audio", dataUrl, "user");
                    sendToWebhook({
                        type: "voice",
                        audio: dataUrl,
                        mimeType: blob.type
                    });
                };
                reader.readAsDataURL(blob);
            });

            mediaRecorder.start();
            recordStartTime = Date.now();

            micBtn.classList.add("mai-recording");
            micBtn.innerHTML = ICON_STOP;
            input.style.display = "none";
            recBar.classList.add("mai-show");
            recTimer.textContent = "0:00";

            recordIntervalId = setInterval(function(){
                var elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                recTimer.textContent = fmtTime(elapsed);
                if(elapsed >= MAX_RECORD_SECONDS){
                    stopRecording(false);
                }
            }, 250);
        })
        .catch(function(err){
            console.error("Milestones AI mic error:", err);
            addMessage("text", "\u26A0\uFE0F Microphone access was blocked. Please allow it in your browser settings to send voice messages.", "bot");
        });
    }

    function stopRecording(cancelled){
        recordCancelled = !!cancelled;

        if(recordIntervalId){
            clearInterval(recordIntervalId);
            recordIntervalId = null;
        }
        if(mediaRecorder && mediaRecorder.state !== "inactive"){
            mediaRecorder.stop();
        }

        micBtn.classList.remove("mai-recording");
        micBtn.innerHTML = ICON_MIC;
        input.style.display = "";
        recBar.classList.remove("mai-show");
    }

    micBtn.addEventListener("click", function(){
        if(isSending) return;
        if(micBtn.classList.contains("mai-recording")){
            stopRecording(false);
        } else {
            startRecording();
        }
    });

    recCancel.addEventListener("click", function(){
        stopRecording(true);
    });

    refreshSendButton();
})();
</script>
